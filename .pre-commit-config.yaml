repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: venv/Scripts/python.exe -m ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: venv/Scripts/python.exe -m ruff format
        language: system
        types: [python]
        require_serial: true
