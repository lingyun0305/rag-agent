<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调整参数 - AI对话助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f6f7;
            height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 64px; background: #1a1d29; display: flex; flex-direction: column;
            align-items: center; padding: 16px 0; flex-shrink: 0;
        }
        .sidebar-logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: white; margin-bottom: 24px;
        }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-item {
            width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; color: #8892a0; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .sidebar-item.active { background: rgba(64, 224, 208, 0.2); color: #40E0D0; }
        .sidebar-item svg { width: 20px; height: 20px; }
        .sidebar-item .tooltip {
            position: absolute; left: 56px; background: #2d3748; color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
        }
        .sidebar-item:hover .tooltip { opacity: 1; }
        .sidebar-bottom { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* ===== 主内容区 ===== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部栏 */
        .top-bar {
            padding: 16px 24px; background: #ffffff; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #e8ecf1;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px; padding: 8px 14px;
            background: #f5f6f7; border: none; border-radius: 8px; color: #666;
            font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .back-btn:hover { background: #e8ecf1; color: #333; }

        /* 内容区 */
        .content-area {
            flex: 1; padding: 24px; overflow-y: auto;
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        /* 步骤条 */
        .steps-container {
            background: #fff; border-radius: 12px; padding: 24px 40px;
            border: 1px solid #e8ecf1; margin-bottom: 20px;
        }
        .steps {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 700px; margin: 0 auto;
        }
        .step {
            display: flex; align-items: center; gap: 10px;
        }
        .step-circle {
            width: 32px; height: 32px; border-radius: 50%;
            background: #e8ecf1; color: #9ca3af;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
            transition: all 0.3s;
        }
        .step.active .step-circle {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }
        .step.done .step-circle {
            background: #22c55e; color: white;
        }
        .step-text {
            font-size: 14px; color: #9ca3af; font-weight: 500;
        }
        .step.active .step-text { color: #1a1a2e; }
        .step.done .step-text { color: #22c55e; }
        .step-line {
            flex: 1; height: 2px; background: #e8ecf1; margin: 0 16px;
            min-width: 60px;
        }
        .step-line.done { background: #22c55e; }

        /* 配置区 */
        .config-section {
            background: #fff; border-radius: 12px; border: 1px solid #e8ecf1;
            margin-bottom: 16px; overflow: hidden;
        }
        .config-section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px; cursor: pointer; transition: background 0.2s;
        }
        .config-section-header:hover { background: #f8fafc; }
        .config-section-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 15px; font-weight: 600; color: #1a1a2e;
            border-left: 3px solid #40E0D0; padding-left: 12px;
        }
        .config-section-toggle {
            width: 20px; height: 20px; color: #9ca3af;
            transition: transform 0.3s;
        }
        .config-section.collapsed .config-section-toggle { transform: rotate(180deg); }
        .config-section-body {
            padding: 20px 24px; border-top: 1px solid #f1f5f9;
            transition: max-height 0.3s ease;
        }
        .config-section.collapsed .config-section-body {
            display: none;
        }

        /* 单选卡片 */
        .radio-group { display: flex; flex-direction: column; gap: 12px; }
        .radio-card {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 16px 20px; border: 2px solid #e8ecf1; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .radio-card:hover { border-color: #40E0D0; background: #f0fdfa; }
        .radio-card.selected { border-color: #40E0D0; background: #f0fdfa; }
        .radio-card-radio {
            width: 20px; height: 20px; border: 2px solid #cbd5e1;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }
        .radio-card.selected .radio-card-radio { border-color: #40E0D0; }
        .radio-card.selected .radio-card-radio::after {
            content: ''; width: 8px; height: 8px;
            background: #40E0D0; border-radius: 50%;
        }
        .radio-card-info { display: flex; flex-direction: column; }
        .radio-card-name {
            font-size: 15px; font-weight: 500; color: #1a1a2e;
            display: flex; align-items: center; gap: 6px;
        }
        .radio-card-desc { font-size: 13px; color: #64748b; margin-top: 2px; }
        .help-icon {
            width: 16px; height: 16px; border-radius: 50%;
            background: #e8ecf1; color: #64748b;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 600; cursor: help;
        }

        /* 配置表单 */
        .config-form { display: flex; flex-direction: column; gap: 20px; }
        .form-row {
            display: flex; align-items: center; gap: 16px;
        }
        .form-label {
            width: 120px; font-size: 14px; color: #475569; flex-shrink: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .help-icon-lg {
            width: 18px; height: 18px; border-radius: 50%;
            background: #e8ecf1; color: #64748b;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600; cursor: help;
        }
        .form-controls { display: flex; align-items: center; gap: 12px; }
        .form-select, .form-input {
            padding: 8px 12px; border: 1px solid #e8ecf1; border-radius: 8px;
            font-size: 14px; color: #333; outline: none; transition: all 0.2s;
            background: white;
        }
        .form-select:focus, .form-input:focus {
            border-color: #40E0D0; box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.15);
        }
        .form-select { min-width: 180px; }
        .form-input { width: 120px; }

        /* 底部操作栏 */
        .footer-actions {
            display: flex; justify-content: flex-end; gap: 12px;
            padding-top: 8px; margin-top: 16px;
        }
        .btn {
            padding: 10px 24px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #fff; color: #64748b; border: 1px solid #e8ecf1; }
        .btn-secondary:hover { background: #f8fafc; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 20px;
            border-radius: 12px; color: white; font-size: 14px; z-index: 2000;
            animation: slideIn 0.3s; display: none;
        }
        .toast.show { display: block; }
        .toast.success { background: #2ed573; }
        .toast.error { background: #ff4757; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8); display: flex;
            align-items: center; justify-content: center; z-index: 1500;
        }
        .loading-overlay.hidden { display: none; }
        .loading-spinner {
            width: 40px; height: 40px; border: 4px solid #e8ecf1;
            border-top-color: #40E0D0; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="/front/js/auth.js?v=20260812"></script>
</head>
<body>
    <div class="app-container">

                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>

                    </svg>
                    <span class="tooltip">帮助</span>
                </div>
                <div class="sidebar-avatar" onclick="location.href='/front/account.html'">U</div>

        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="top-bar">
                <button class="back-btn" onclick="goBack()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    退出
                </button>
            </div>

            <!-- 内容区 -->
            <div class="content-area">
                <!-- 步骤条 -->
                <div class="steps-container">
                    <div class="steps">
                        <div class="step active" id="step1">
                            <div class="step-circle">1</div>
                            <div class="step-text">调整参数</div>
                        </div>
                        <div class="step-line" id="line1"></div>
                        <div class="step" id="step2">
                            <div class="step-circle">2</div>
                            <div class="step-text">数据预览</div>
                        </div>
                        <div class="step-line" id="line2"></div>
                        <div class="step" id="step3">
                            <div class="step-circle">3</div>
                            <div class="step-text">确认上传</div>
                        </div>
                    </div>
                </div>

                <!-- 分块处理参数 -->
                <div class="config-section" id="section_chunk_params">
                    <div class="config-section-header" onclick="toggleSection('section_chunk_params')">
                        <div class="config-section-title">分块处理参数</div>
                        <svg class="config-section-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="config-section-body">
                        <div class="radio-group" style="margin-bottom: 20px;">
                            <div class="radio-card selected" data-value="default" onclick="selectChunkParam('default')">
                                <div class="radio-card-radio"></div>
                                <div class="radio-card-info">

                                                </label>
                                                <label style="display:flex; flex-direction:column; cursor:pointer; margin-right:8px;">
                                                    <div style="display:flex; align-items:center;">
                                                        <input type="radio" name="splitMethod" value="chapter" onchange="onSplitMethodChange('chapter')">

                                                <label style="display:flex; flex-direction:column; cursor:pointer;">
                                                    <div style="display:flex; align-items:center;">

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const kbId = urlParams.get('kb_id') || '';
    const docId = urlParams.get('doc_id') || '';

    let config = {
        chunk_size: 500,
        chunk_overlap: 50,
        separators: ["\n\n", "\n", "。", "，", " "],
        top_k: 6,
        score_threshold: 0.0,
        embedding_model: "bge",
        split_method: "char"
    };

    function goBack() {
        location.href = `/front/kb_detail.html?kb_id=${kbId}`;
    }

    function toggleSection(sectionId) {
        const section = document.getElementById(sectionId);
        section.classList.toggle('collapsed');
    }

    function selectChunkParam(mode) {
        config.chunkParamMode = mode;
        document.querySelectorAll('#section_chunk_params .radio-card').forEach(card => {
            card.classList.toggle('selected', card.dataset.value === mode);
        });
        const customParams = document.getElementById('customParams');
        if (mode === 'custom') {
            customParams.style.display = 'block';
            config.chunk_size = parseInt(document.getElementById('chunkSize').value) || 500;
            config.chunk_overlap = parseInt(document.getElementById('chunkOverlap').value) || 50;
            config.embedding_model = document.getElementById('embeddingModel').value || 'bge';
            const checked = document.querySelector('input[name="splitMethod"]:checked');
            config.split_method = checked ? checked.value : 'char';
            onSplitMethodChange(config.split_method);
        } else {
            customParams.style.display = 'none';
            config.chunk_size = 500;
            config.chunk_overlap = 50;
            config.separators = ["\n\n", "\n", "。", "，", " "];
            config.embedding_model = "bge";
            config.split_method = "char";
        }
    }

    function onSplitMethodChange(method) {
        config.split_method = method;
        const charParams = document.getElementById('charParams');
        if (method === 'char') {
            charParams.style.display = '';
            config.chunk_size = parseInt(document.getElementById('chunkSize').value) || 500;
            config.chunk_overlap = parseInt(document.getElementById('chunkOverlap').value) || 50;
        } else {
            charParams.style.display = 'none';
            config.chunk_size = 500;
            config.chunk_overlap = 50;
        }
    }

    function saveCustomParams() {
        config.chunk_size = parseInt(document.getElementById('chunkSize').value) || 500;
        config.chunk_overlap = parseInt(document.getElementById('chunkOverlap').value) || 50;
        config.embedding_model = document.getElementById('embeddingModel').value || 'bge';
        const checked = document.querySelector('input[name="splitMethod"]:checked');
        config.split_method = checked ? checked.value : 'char';
        if (config.split_method !== 'char') {
            config.chunk_size = 500;
            config.chunk_overlap = 50;
        }
    }

    async function loadDocConfig() {
        if (!kbId || !docId) {
            showToast('缺少必要参数', 'error');
            return;
        }

        const token = localStorage.getItem('access_token');
        try {
            const resp = await fetch(`/api/knowledge/kb/${kbId}/documents/${docId}/config`, {
                method: 'GET',
                headers: {
                    'Authorization': token ? `Bearer ${token}` : ''
                }
            });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.msg || '加载文档配置失败');
            }

            const data = await resp.json();
            if (!data.success) {
                throw new Error(data.msg || '加载文档配置失败');
            }

            const docConfig = data.config || data.data || data;

            if (docConfig.chunk_size !== undefined) {
                config.chunk_size = docConfig.chunk_size;
            }
            if (docConfig.chunk_overlap !== undefined) {
                config.chunk_overlap = docConfig.chunk_overlap;
            }
            if (docConfig.embedding_model) {
                config.embedding_model = docConfig.embedding_model;
            }
            if (docConfig.separators) {
                config.separators = docConfig.separators;
            }
            if (docConfig.split_method) {
                config.split_method = docConfig.split_method;
            }

            if (config.chunk_size !== 500 || config.chunk_overlap !== 50 || 
                config.embedding_model !== 'bge' || config.split_method !== 'char') {
                selectChunkParam('custom');
                document.getElementById('chunkSize').value = config.chunk_size;
                document.getElementById('chunkOverlap').value = config.chunk_overlap;
                const radio = document.querySelector(`input[name="splitMethod"][value="${config.split_method}"]`);
                if (radio) {
                    radio.checked = true;
                }
                onSplitMethodChange(config.split_method);
            }

            showToast('配置加载成功', 'success');
        } catch (err) {
            console.error('加载文档配置失败:', err);
            showToast(err.message || '加载文档配置失败', 'error');
        }
    }

    async function goToNextStep() {
        saveCustomParams();

        if (!kbId || !docId) {
            showToast('缺少必要参数', 'error');
            return;
        }

        const token = localStorage.getItem('access_token');
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = true;
        nextBtn.textContent = '生成预览中...';
        showToast('正在生成预览...', 'success');

        try {
            const resp = await fetch(`/api/knowledge/kb/${kbId}/documents/${docId}/preview`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    doc_id: docId,
                    chunk_size: config.chunk_size,
                    chunk_overlap: config.chunk_overlap,
                    separators: config.separators,
                    top_k: config.top_k,
                    score_threshold: config.score_threshold,
                    embedding_model: config.embedding_model,
                    split_method: config.split_method
                })
            });

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.msg || '预览生成失败');
            }

            const data = await resp.json();
            if (!data.success) {
                throw new Error(data.msg || '预览生成失败');
            }

            const previewResults = Array.isArray(data.preview) ? data.preview : [data];

            sessionStorage.setItem('adjust_config', JSON.stringify(config));
            sessionStorage.setItem('adjust_preview_results', JSON.stringify(previewResults));

            showToast('预览生成成功', 'success');

            setTimeout(() => {
                location.href = `/front/adjust_preview.html?kb_id=${kbId}&doc_id=${docId}`;
            }, 500);
        } catch (err) {
            console.error('预览生成失败:', err);
            showToast(err.message || '预览生成失败', 'error');
            nextBtn.disabled = false;
            nextBtn.textContent = '下一步';
        }
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function loadEmbeddingModels() {
        const selectEl = document.getElementById('embeddingModel');
        try {
            const token = localStorage.getItem('access_token');
            const resp = await fetch('/api/knowledge/embedding_models', {
                method: 'GET',
                headers: {
                    'Authorization': token ? `Bearer ${token}` : ''
                }
            });
            if (!resp.ok) throw new Error('加载嵌入模型列表失败');
            const data = await resp.json();
            if (!data.success || !Array.isArray(data.models) || data.models.length === 0) {
                throw new Error('没有可用的嵌入模型');
            }
            selectEl.innerHTML = '';
            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.provider;
                opt.textContent = m.display_name;
                selectEl.appendChild(opt);
            });
            if (config.embedding_model) {
                selectEl.value = config.embedding_model;
            } else if (data.default) {
                selectEl.value = data.default;
                config.embedding_model = data.default;
            }
        } catch (err) {
            selectEl.innerHTML = '<option value="">加载失败</option>';
            showToast(err.message || '嵌入模型列表加载失败', 'error');
            config.embedding_model = 'bge';
        }
    }

    document.getElementById('loadingOverlay').classList.remove('hidden');
    Promise.all([loadEmbeddingModels(), loadDocConfig()]).finally(() => {
        document.getElementById('loadingOverlay').classList.add('hidden');
    });
    </script>
</body>
</html>
