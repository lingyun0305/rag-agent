<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传数据集 - AI对话助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f6f7;
            height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 64px; background: #1a1d29; display: flex; flex-direction: column;
            align-items: center; padding: 16px 0; flex-shrink: 0;
        }
        .sidebar-logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: white; margin-bottom: 24px;
        }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-item {
            width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; color: #8892a0; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .sidebar-item.active { background: rgba(64, 224, 208, 0.2); color: #40E0D0; }
        .sidebar-item svg { width: 20px; height: 20px; }
        .sidebar-item .tooltip {
            position: absolute; left: 56px; background: #2d3748; color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
        }
        .sidebar-item:hover .tooltip { opacity: 1; }
        .sidebar-bottom { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* ===== 主内容区 ===== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部栏 */
        .top-bar {
            padding: 16px 24px; background: #ffffff; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #e8ecf1;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px; padding: 8px 14px;
            background: #f5f6f7; border: none; border-radius: 8px; color: #666;
            font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .back-btn:hover { background: #e8ecf1; color: #333; }

        /* 内容区 */
        .content-area {
            flex: 1; padding: 24px; overflow-y: auto;
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        /* 步骤条 */
        .steps-container {
            background: #fff; border-radius: 12px; padding: 24px 40px;
            border: 1px solid #e8ecf1; margin-bottom: 20px;
        }
        .steps {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 900px; margin: 0 auto;
        }
        .step {
            display: flex; align-items: center; gap: 10px;
        }
        .step-circle {
            width: 32px; height: 32px; border-radius: 50%;
            background: #e8ecf1; color: #9ca3af;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
            transition: all 0.3s;
        }
        .step.active .step-circle {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }
        .step.done .step-circle {
            background: #22c55e; color: white;
        }
        .step-text {
            font-size: 14px; color: #9ca3af; font-weight: 500;
        }
        .step.active .step-text { color: #1a1a2e; }
        .step.done .step-text { color: #22c55e; }
        .step-line {
            flex: 1; height: 2px; background: #e8ecf1; margin: 0 16px;
            min-width: 60px;
        }
        .step-line.done { background: #22c55e; }

        /* 上传区 */
        .upload-area {
            background: #fff; border-radius: 12px; border: 1px solid #e8ecf1;
            padding: 20px; margin-bottom: 20px;
        }

        .upload-drag {
            border: 2px dashed #d1d5db; border-radius: 12px;
            padding: 60px 20px; text-align: center; cursor: pointer;
            transition: all 0.3s; background: #fafbfc;
        }
        .upload-drag:hover, .upload-drag.dragover {
            border-color: #40E0D0; background: #f0fdfa;
        }
        .upload-icon {
            width: 56px; height: 56px; margin: 0 auto 16px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .upload-title {
            font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px;
        }
        .upload-desc {
            font-size: 13px; color: #64748b; line-height: 1.6;
        }

        /* 文件列表 */
        .file-list-container {
            background: #fff; border-radius: 12px; border: 1px solid #e8ecf1;
            overflow: hidden; margin-bottom: 20px;
        }
        .file-list-header {
            display: flex; align-items: center;
            padding: 14px 20px;
            background: #f8fafc; font-size: 13px; font-weight: 600;
            color: #64748b;
        }
        .file-list-header .col-name { flex: 2; }
        .file-list-header .col-progress { flex: 2; }
        .file-list-header .col-size { flex: 1; }
        .file-list-header .col-action { width: 60px; text-align: right; }

        .file-list { max-height: 300px; overflow-y: auto; }
        .file-list::-webkit-scrollbar { width: 4px; }
        .file-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

        .file-item {
            display: flex; align-items: center;
            padding: 14px 20px; border-top: 1px solid #f1f5f9;
            font-size: 14px;
        }
        .file-item:first-child { border-top: none; }
        .file-item .col-name {
            flex: 2; display: flex; align-items: center; gap: 10px; min-width: 0;
        }
        .file-item .file-icon {
            width: 32px; height: 32px; border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-size: 12px;
            flex-shrink: 0; font-weight: 600;
        }
        .file-item .file-icon.txt, .file-item .file-icon.md { background: #e0e7ff; color: #7c3aed; }
        .file-item .file-icon.pdf { background: #fee2e2; color: #ef4444; }
        .file-item .file-icon.docx { background: #dbeafe; color: #2563eb; }
        .file-item .file-icon.csv { background: #dcfce7; color: #16a34a; }
        .file-item .file-icon.default { background: #f1f5f9; color: #64748b; }
        .file-item .file-name {
            color: #1a1a2e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .file-item .col-progress {
            flex: 2; display: flex; align-items: center; gap: 10px;
        }
        .progress-bar {
            flex: 1; height: 8px; background: #e8ecf1; border-radius: 4px; overflow: hidden;
            max-width: 200px;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #40E0D0, #20B2AA);
            border-radius: 4px; transition: width 0.3s;
        }
        .progress-text {
            font-size: 13px; color: #64748b; min-width: 50px; text-align: right;
        }
        .progress-failed {
            font-size: 13px; color: #ef4444; font-weight: 500;
        }
        .file-item .col-size { flex: 1; color: #64748b; }
        .file-item .col-action { width: 60px; text-align: right; }

        .file-remove-btn {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 6px; cursor: pointer; color: #9ca3af;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .file-remove-btn:hover { background: #fef2f2; color: #ef4444; }

        .empty-file-list {
            padding: 40px 20px; text-align: center; color: #9ca3af;
        }

        /* 底部操作栏 */
        .footer-actions {
            display: flex; justify-content: flex-end; gap: 12px;
            padding-top: 8px;
        }
        .btn {
            padding: 10px 24px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #fff; color: #64748b; border: 1px solid #e8ecf1; }
        .btn-secondary:hover { background: #f8fafc; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 20px;
            border-radius: 12px; color: white; font-size: 14px; z-index: 2000;
            animation: slideIn 0.3s; display: none;
        }
        .toast.show { display: block; }
        .toast.success { background: #2ed573; }
        .toast.error { background: #ff4757; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

        .file-input { display: none; }

        /* 自定义文本模式样式 */
        .text-source-area {
            background: #fff; border-radius: 12px; border: 1px solid #e8ecf1;
            padding: 24px; margin-bottom: 20px; display: none;
        }
        .text-source-area.show { display: block; }
        .text-form-group { margin-bottom: 20px; }
        .text-form-label {
            display: block; font-size: 14px; font-weight: 500; color: #374151;
            margin-bottom: 8px;
        }
        .text-form-label .required { color: #ef4444; margin-left: 4px; }
        .text-form-input {
            width: 100%; padding: 10px 14px; border: 1px solid #e8ecf1;
            border-radius: 8px; font-size: 14px; transition: all 0.2s;
            background: #fafbfc;
        }
        .text-form-input:focus {
            outline: none; border-color: #40E0D0; background: #fff;
            box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.1);
        }
        .text-form-textarea {
            width: 100%; min-height: 320px; padding: 14px;
            border: 1px solid #e8ecf1; border-radius: 8px;
            font-size: 14px; font-family: inherit;
            transition: all 0.2s; background: #fafbfc;
            resize: vertical; line-height: 1.6;
        }
        .text-form-textarea:focus {
            outline: none; border-color: #40E0D0; background: #fff;
            box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.1);
        }
        .text-form-hint {
            font-size: 12px; color: #9ca3af; margin-top: 6px;
        }
        .text-form-counter {
            font-size: 12px; color: #9ca3af; text-align: right; margin-top: 6px;
        }
        .text-form-counter.warning { color: #f59e0b; }
        .text-form-counter.danger { color: #ef4444; }
        
        /* 文件模式样式（用于隐藏） */
        .file-source-area.hide { display: none; }
        .file-source-area-container.hide { display: none; }
    </style>
    <script src="/front/js/auth.js?v=20260801"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                </svg>
            </div>
            <div class="sidebar-nav">
                <div class="sidebar-item" onclick="location.href='/front/'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="tooltip">对话</span>
                </div>
                <div class="sidebar-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span class="tooltip">知识库</span>
                </div>
                <div class="sidebar-item" onclick="location.href='/front/workbench.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="tooltip">工作台</span>
                </div>
                <div class="sidebar-item" onclick="location.href='/front/account.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="tooltip">账号</span>
                </div>
            </div>
            <div class="sidebar-bottom">
                <div class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip">帮助</span>
                </div>
                <div class="sidebar-avatar" onclick="location.href='/front/account.html'">U</div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="top-bar">
                <button class="back-btn" onclick="goBack()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    退出
                </button>
            </div>

            <!-- 内容区 -->
            <div class="content-area">
                <!-- 步骤条 -->
                <div class="steps-container">
                    <div class="steps">
                        <div class="step active" id="step1">
                            <div class="step-circle">1</div>
                            <div class="step-text">选择文件</div>
                        </div>
                        <div class="step-line" id="line1"></div>
                        <div class="step" id="step2">
                            <div class="step-circle">2</div>
                            <div class="step-text">参数设置</div>
                        </div>
                        <div class="step-line" id="line2"></div>
                        <div class="step" id="step3">
                            <div class="step-circle">3</div>
                            <div class="step-text">数据预览</div>
                        </div>
                        <div class="step-line" id="line3"></div>
                        <div class="step" id="step4">
                            <div class="step-circle">4</div>
                            <div class="step-text">确认上传</div>
                        </div>
                    </div>
                </div>

                <!-- 上传区（文件模式） -->
                <div class="upload-area file-source-area" id="fileSourceArea">
                    <div class="upload-drag" id="uploadDrag" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <div class="upload-title">点击或拖动文件到此处上传</div>
                        <div class="upload-desc">
                            支持 .txt, .docx, .csv, .xlsx, .pdf, .md, .html, .pptx 类型文件<br>
                            单次可上传 5 个 50 MB 的文件
                        </div>
                    </div>
                    <input type="file" id="fileInput" class="file-input" multiple
                        accept=".txt,.docx,.csv,.xlsx,.pdf,.md,.html,.pptx"
                        onchange="handleFileSelect(event)">
                </div>

                <!-- 文件列表（文件模式） -->
                <div class="file-list-container file-source-area-container" id="fileSourceListContainer">
                    <div class="file-list-header">
                        <div class="col-name">文件名</div>
                        <div class="col-progress">文件上传进度</div>
                        <div class="col-size">文件大小</div>
                        <div class="col-action"></div>
                    </div>
                    <div class="file-list" id="fileList">
                        <div class="empty-file-list">暂无文件，请点击上方区域添加</div>
                    </div>
                </div>

                <!-- 自定义文本输入区（文本模式） -->
                <div class="text-source-area" id="textSourceArea">
                    <div class="text-form-group">
                        <label class="text-form-label">
                            数据集名称<span class="required">*</span>
                        </label>
                        <input type="text" id="textDatasetName" class="text-form-input" 
                            placeholder="请输入数据集名称，例如：产品说明文档">
                    </div>
                    <div class="text-form-group">
                        <label class="text-form-label">
                            数据集内容<span class="required">*</span>
                        </label>
                        <textarea id="textDatasetContent" class="text-form-textarea" 
                            placeholder="请在此输入或粘贴文本内容作为数据集..."></textarea>
                        <div class="text-form-counter" id="textContentCounter">0 字符</div>
                        <div class="text-form-hint">
                            支持输入任意文本内容，建议不超过 50,000 字符。内容将自动进行分块处理。
                        </div>
                    </div>
                </div>

                <!-- 底部操作 -->
                <div class="footer-actions">
                    <button class="btn btn-secondary" id="clearBtn" onclick="clearAllFiles()" style="margin-right:12px;">
                        清除
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="goToNextStep()" disabled>
                        <span id="nextBtnText">下一步</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const kbId = urlParams.get('kb_id') || '';
    const sourceType = urlParams.get('source') || 'file';  // 'file' or 'text'

    let fileList = [];
    let uploading = false;

    // 根据来源类型初始化界面
    function initSourceUI() {
        const fileSourceArea = document.getElementById('fileSourceArea');
        const fileSourceListContainer = document.getElementById('fileSourceListContainer');
        const textSourceArea = document.getElementById('textSourceArea');
        const clearBtn = document.getElementById('clearBtn');

        if (sourceType === 'text') {
            // 显示文本输入模式
            fileSourceArea.classList.add('hide');
            fileSourceListContainer.classList.add('hide');
            textSourceArea.classList.add('show');
            clearBtn.style.display = 'none';
            
            // 更新步骤条文字
            document.querySelector('#step1 .step-text').textContent = '输入内容';
            
            // 绑定文本内容计数
            const textContent = document.getElementById('textDatasetContent');
            const textContentCounter = document.getElementById('textContentCounter');
            if (textContent) {
                textContent.addEventListener('input', () => {
                    const len = textContent.value.length;
                    textContentCounter.textContent = `${len} 字符`;
                    
                    // 更新计数颜色
                    textContentCounter.classList.remove('warning', 'danger');
                    if (len > 50000) {
                        textContentCounter.classList.add('danger');
                    } else if (len > 30000) {
                        textContentCounter.classList.add('warning');
                    }
                    
                    // 更新下一步按钮状态
                    updateTextNextBtn();
                });
            }
            
            const textName = document.getElementById('textDatasetName');
            if (textName) {
                textName.addEventListener('input', updateTextNextBtn);
            }
        } else {
            // 显示文件上传模式
            fileSourceArea.classList.remove('hide');
            fileSourceListContainer.classList.remove('hide');
            textSourceArea.classList.remove('show');
            clearBtn.style.display = 'flex';
        }
    }

    function updateTextNextBtn() {
        const name = document.getElementById('textDatasetName')?.value?.trim() || '';
        const content = document.getElementById('textDatasetContent')?.value?.trim() || '';
        const nextBtn = document.getElementById('nextBtn');
        const nextBtnText = document.getElementById('nextBtnText');
        
        if (name && content) {
            nextBtn.disabled = false;
            const len = content.length;
            nextBtnText.textContent = `共 ${len} 字符 | 下一步`;
        } else {
            nextBtn.disabled = true;
            nextBtnText.textContent = '下一步';
        }
    }

    // 初始化界面
    initSourceUI();

    // 从 sessionStorage 恢复已上传的文件列表（从第二步/第三步返回时）
    // 注意：点击退出按钮时会清空 sessionStorage，所以这里读取不到数据
    try {
        const savedRaw = sessionStorage.getItem('uploaded_files');
        console.log('[upload] 初始化，检查 sessionStorage:', {
            hasUploadedFiles: savedRaw !== null,
            size: savedRaw ? savedRaw.length : 0
        });
        
        if (savedRaw) {
            const saved = JSON.parse(savedRaw);
            if (Array.isArray(saved) && saved.length > 0) {
                fileList = saved.map(f => ({
                    id: Date.now() + Math.random(),
                    name: f.name,
                    size: f.size,
                    type: f.type || '',
                    status: 'completed',
                    progress: 100,
                    batch_id: f.batch_id
                }));
                console.log('[upload] 从 sessionStorage 恢复', fileList.length, '个文件');
            }
        }
    } catch (e) {
        console.error('[upload] 解析 sessionStorage 失败:', e);
    }

    // 如果有已恢复的文件，立即渲染
    if (fileList.length > 0) {
        renderFileList();
        updateNextBtn();
    }

    // 拖拽上传
    const dragArea = document.getElementById('uploadDrag');
    dragArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        dragArea.classList.add('dragover');
    });
    dragArea.addEventListener('dragleave', () => {
        dragArea.classList.remove('dragover');
    });
    dragArea.addEventListener('drop', (e) => {
        e.preventDefault();
        dragArea.classList.remove('dragover');
        const files = e.dataTransfer.files;
        handleFiles(files);
    });

    // 文件列表事件委托 - 处理删除按钮点击
    const fileListEl = document.getElementById('fileList');
    if (fileListEl) {
        fileListEl.addEventListener('click', (e) => {
            const removeBtn = e.target.closest('[data-action="remove"]');
            if (removeBtn) {
                e.stopPropagation();
                const fileItem = removeBtn.closest('.file-item');
                if (fileItem) {
                    const id = parseFloat(fileItem.dataset.id);
                    console.log('[upload] 删除按钮点击, id:', id);
                    removeFile(id);
                }
            }
        });
    }

    function goBack() {
        console.log('[upload] goBack: 开始退出流程');
        
        // 退出前清理所有暂存文件和 sessionStorage
        const batchIds = fileList.filter(f => f.batch_id).map(f => f.batch_id);
        console.log('[upload] goBack: 待清理的 batch_ids:', batchIds);
        
        const clearSessionStorage = () => {
            // 清理所有上传相关的 sessionStorage 数据
            const keysToRemove = ['uploaded_files', 'upload_config', 'preview_results', 'kb_id', 'text_dataset'];
            keysToRemove.forEach(key => {
                sessionStorage.removeItem(key);
                console.log(`[upload] goBack: 移除 ${key}`);
            });
            console.log('[upload] goBack: sessionStorage 已清理');
        };
        
        const doNavigate = () => {
            clearSessionStorage();
            // 延迟一点时间确保清理完成，然后跳转
            setTimeout(() => {
                if (kbId) {
                    console.log('[upload] goBack: 跳转到 kb_detail.html');
                    location.href = `/front/kb_detail.html?kb_id=${kbId}`;
                } else {
                    console.log('[upload] goBack: 跳转到 knowledge.html');
                    location.href = '/front/knowledge.html';
                }
            }, 100);
        };

        if (batchIds.length > 0) {
            // 先清理后端暂存，再清理前端
            console.log('[upload] goBack: 清理后端暂存文件');
            cleanupStaging(batchIds).finally(() => {
                console.log('[upload] goBack: 后端清理完成');
                doNavigate();
            });
        } else {
            // 没有已上传的文件，直接清理前端并跳转
            console.log('[upload] goBack: 无后端文件需清理');
            doNavigate();
        }
    }

    async function cleanupStaging(batchIds) {
        if (!batchIds || batchIds.length === 0) return;
        const token = localStorage.getItem('access_token');
        try {
            await fetch('/api/knowledge/upload/cleanup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ batch_ids: batchIds })
            });
        } catch (e) {
            console.warn('[cleanup] 清理暂存文件失败（不影响流程）', e);
        }
    }

    function clearAllFiles() {
        if (fileList.length === 0) {
            showToast('列表已为空', 'error');
            return;
        }
        if (!confirm(`确定清除 ${fileList.length} 个文件吗？已上传的暂存文件将被删除。`)) {
            return;
        }
        const batchIds = fileList.filter(f => f.batch_id).map(f => f.batch_id);
        fileList = [];
        renderFileList();
        updateNextBtn();
        sessionStorage.removeItem('uploaded_files');
        // 异步清理后端暂存
        if (batchIds.length > 0) {
            cleanupStaging(batchIds);
        }
        showToast('已清除所有文件', 'success');
    }

    function handleFileSelect(event) {
        const files = event.target.files;
        handleFiles(files);
        event.target.value = '';
    }

    function handleFiles(files) {
        const validTypes = ['.txt', '.docx', '.csv', '.xlsx', '.pdf', '.md', '.html', '.pptx'];
        const maxSize = 50 * 1024 * 1024; // 50 MB
        const maxFiles = 5;
        let added = 0;

        for (const file of files) {
            if (fileList.length >= maxFiles) {
                showToast(`最多可上传 ${maxFiles} 个文件`, 'error');
                break;
            }

            const ext = '.' + file.name.split('.').pop().toLowerCase();
            if (!validTypes.includes(ext)) {
                showToast(`不支持的文件类型: ${file.name}`, 'error');
                continue;
            }
            if (file.size > maxSize) {
                showToast(`文件过大: ${file.name} (最大50MB)`, 'error');
                continue;
            }

            const fileItem = {
                id: Date.now() + Math.random(),
                file: file,
                name: file.name,
                size: file.size,
                type: ext.substring(1),
                progress: 0,
                status: 'pending'
            };
            fileList.push(fileItem);
            added++;
        }

        if (added > 0) {
            renderFileList();
            autoUpload();
        }
    }

    function renderFileList() {
        const list = document.getElementById('fileList');
        if (fileList.length === 0) {
            list.innerHTML = '<div class="empty-file-list">暂无文件，请点击上方区域添加</div>';
            return;
        }

        list.innerHTML = fileList.map(item => {
            const iconClass = getFileIconClass(item.type);
            const sizeStr = formatFileSize(item.size);
            const canRemove = item.status === 'pending' || item.status === 'failed' || item.status === 'completed';
            let progressHtml;
            if (item.status === 'failed') {
                progressHtml = `<span class="progress-failed">上传失败</span>`;
            } else {
                progressHtml = `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${item.progress}%;"></div>
                    </div>
                    <span class="progress-text">${item.progress}%</span>
                `;
            }
            return `
                <div class="file-item" data-id="${item.id}">
                    <div class="col-name">
                        <div class="file-icon ${iconClass}">${item.type.toUpperCase()}</div>
                        <span class="file-name">${escapeHtml(item.name)}</span>
                    </div>
                    <div class="col-progress">${progressHtml}</div>
                    <div class="col-size">${sizeStr}</div>
                    <div class="col-action">
                        ${canRemove ? `
                        <button class="file-remove-btn" data-action="remove" title="移除" aria-label="移除文件">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>` : ''}
                    </div>
                </div>
            `;
        }).join('');

        updateNextBtn();
    }

    function updateNextBtn() {
        const nextBtn = document.getElementById('nextBtn');
        if (fileList.length === 0) {
            nextBtn.disabled = true;
            document.getElementById('nextBtnText').textContent = '下一步';
            return;
        }
        const hasPending = fileList.some(f => f.status === 'pending' || f.status === 'uploading');
        const hasFailed = fileList.some(f => f.status === 'failed');
        if (hasPending) {
            nextBtn.disabled = true;
            document.getElementById('nextBtnText').textContent = '上传中...';
        } else if (hasFailed) {
            nextBtn.disabled = true;
            document.getElementById('nextBtnText').textContent = '请移除或重试失败的文件';
        } else {
            nextBtn.disabled = false;
            document.getElementById('nextBtnText').textContent = `共 ${fileList.length} 个文件 | 下一步`;
        }
    }

    async function autoUpload() {
        if (uploading) return;
        uploading = true;

        let hasError = false;
        for (const item of fileList) {
            if (item.status === 'pending' || item.status === 'failed') {
                try {
                    await uploadFile(item);
                    // 单个文件上传成功后立即保存到 sessionStorage
                    saveToSessionStorage();
                } catch (err) {
                    hasError = true;
                    showToast(`${item.name} 上传失败：${err.message}`, 'error');
                }
            }
        }

        uploading = false;
        updateNextBtn();
        if (!hasError && fileList.length > 0) {
            showToast('所有文件上传成功', 'success');
        }
    }

    function saveToSessionStorage() {
        const uploadedInfo = fileList.filter(f => f.status === 'completed').map(f => ({
            name: f.name,
            size: f.size,
            type: f.type,
            batch_id: f.batch_id
        }));
        sessionStorage.setItem('uploaded_files', JSON.stringify(uploadedInfo));
    }

    function removeFile(id) {
        console.log('[upload] removeFile 被调用, id:', id, '类型:', typeof id);
        console.log('[upload] 当前文件列表:', fileList.map(f => ({ id: f.id, name: f.name })));
        
        // 使用字符串比较来避免浮点数精度问题
        const idStr = String(parseFloat(id));
        const item = fileList.find(f => String(f.id) === idStr);
        
        if (!item) {
            console.warn('[upload] 未找到要删除的文件, id:', id);
            showToast('删除失败：未找到文件', 'error');
            return;
        }
        
        console.log('[upload] 找到文件:', item.name, '开始删除');
        fileList = fileList.filter(f => String(f.id) !== idStr);
        renderFileList();
        updateNextBtn();

        // 如果文件已上传，清理后端暂存
        if (item.batch_id) {
            console.log('[upload] 清理后端暂存, batch_id:', item.batch_id);
            cleanupStaging([item.batch_id]);
        }
        // 更新 sessionStorage
        saveToSessionStorage();
        showToast(`已删除文件: ${item.name}`, 'success');
    }

    async function uploadFile(item) {
        return new Promise((resolve, reject) => {
            const token = localStorage.getItem('access_token');
            const formData = new FormData();
            formData.append('file', item.file);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/knowledge/upload/staging', true);
            if (token) {
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
            }

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    item.progress = pct;
                    updateFileProgress(item.id, pct);
                }
            };

            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const resp = JSON.parse(xhr.responseText);
                        item.batch_id = resp.batch_id;
                        item.status = 'completed';
                        item.progress = 100;
                        updateFileProgress(item.id, 100);
                        resolve();
                    } catch (e) {
                        item.status = 'failed';
                        showUploadFailed(item.id);
                        reject(new Error('响应解析失败'));
                    }
                } else {
                    item.status = 'failed';
                    const errMsg = xhr.responseText ? JSON.parse(xhr.responseText).msg : '上传失败';
                    showUploadFailed(item.id);
                    reject(new Error(errMsg));
                }
            };

            xhr.onerror = () => {
                item.status = 'failed';
                showUploadFailed(item.id);
                reject(new Error('网络错误'));
            };

            item.status = 'uploading';
            xhr.send(formData);
        });
    }

    function updateFileProgress(id, progress) {
        const item = fileList.find(f => f.id === id);
        if (!item) return;
        item.progress = progress;
        const el = document.querySelector(`.file-item[data-id="${id}"]`);
        if (el) {
            const fill = el.querySelector('.progress-fill');
            const text = el.querySelector('.progress-text');
            if (fill) fill.style.width = progress + '%';
            if (text) text.textContent = progress + '%';
        }
    }

    function showUploadFailed(id) {
        const el = document.querySelector(`.file-item[data-id="${id}"]`);
        if (el) {
            const progressCol = el.querySelector('.col-progress');
            if (progressCol) {
                progressCol.innerHTML = `<span class="progress-failed">上传失败</span>`;
            }
        }
    }

    async function goToNextStep() {
        if (sourceType === 'text') {
            // 文本模式：验证输入并上传为临时文件
            const name = document.getElementById('textDatasetName')?.value?.trim() || '';
            const content = document.getElementById('textDatasetContent')?.value?.trim() || '';
            
            if (!name) {
                showToast('请输入数据集名称', 'error');
                return;
            }
            if (!content) {
                showToast('请输入数据集内容', 'error');
                return;
            }
            if (content.length > 50000) {
                showToast('内容过长，建议不超过 50,000 字符', 'error');
                return;
            }
            
            showToast('正在上传文本数据...', 'success');
            
            try {
                // 将文本内容创建为临时文件并上传
                const textBlob = new Blob([content], { type: 'text/plain' });
                const fileName = `${name}.txt`;
                const textFile = new File([textBlob], fileName, { type: 'text/plain' });
                
                // 调用上传接口
                const token = localStorage.getItem('access_token');
                const formData = new FormData();
                formData.append('file', textFile);
                
                const response = await fetch('/api/knowledge/upload/staging', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    showToast(err.msg || '上传失败', 'error');
                    return;
                }
                
                const respData = await response.json();
                
                // 创建文件记录
                const textFileItem = {
                    id: Date.now(),
                    name: fileName,
                    size: textFile.size,
                    type: 'txt',
                    status: 'completed',
                    progress: 100,
                    batch_id: respData.batch_id
                };
                
                // 保存到文件列表和 sessionStorage
                fileList = [textFileItem];
                saveToSessionStorage();
                
                showToast('文本数据上传成功', 'success');
                
                // 跳转到参数设置页面
                sessionStorage.setItem('kb_id', kbId);
                location.href = `/front/upload_params.html?kb_id=${kbId}&source=text&v=20260802`;
                
            } catch (error) {
                console.error('上传文本数据失败:', error);
                showToast('上传失败：' + error.message, 'error');
            }
        } else {
            // 文件模式
            const hasFailed = fileList.some(f => f.status === 'failed');
            const hasPending = fileList.some(f => f.status === 'pending' || f.status === 'uploading');
            if (hasPending) {
                showToast('文件仍在上传中，请稍候', 'error');
                return;
            }
            if (hasFailed) {
                showToast('请移除或重试上传失败的文件', 'error');
                return;
            }
            if (fileList.length === 0) {
                showToast('请先添加文件', 'error');
                return;
            }

            saveToSessionStorage();
            sessionStorage.setItem('kb_id', kbId);
            location.href = `/front/upload_params.html?kb_id=${kbId}&v=20260802`;
        }
    }

    function getFileIconClass(type) {
        const t = (type || '').toLowerCase();
        if (t === 'pdf') return 'pdf';
        if (t === 'docx' || t === 'doc') return 'docx';
        if (t === 'txt' || t === 'md') return 'txt';
        if (t === 'csv' || t === 'xlsx' || t === 'xls') return 'csv';
        return 'default';
    }

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    </script>
</body>
