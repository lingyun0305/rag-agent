<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的知识库 - AI对话助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f6f7;
            height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 64px; background: #1a1d29; display: flex; flex-direction: column;
            align-items: center; padding: 16px 0; flex-shrink: 0;
        }
        .sidebar-logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: white; margin-bottom: 24px;
        }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-item {
            width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; color: #8892a0; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .sidebar-item.active { background: rgba(64, 224, 208, 0.2); color: #40E0D0; }
        .sidebar-item svg { width: 20px; height: 20px; }
        .sidebar-item .tooltip {
            position: absolute; left: 56px; background: #2d3748; color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
        }
        .sidebar-item:hover .tooltip { opacity: 1; }
        .sidebar-bottom { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* ===== 主内容 ===== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部栏 */
        .top-bar {
            padding: 14px 28px; background: #ffffff; display: flex; align-items: center; gap: 16px;
            border-bottom: 1px solid #e8ecf1;
        }
        .top-bar-title { font-size: 18px; font-weight: 600; color: #1a1a2e; }
        .top-bar-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }

        .search-box { display: flex; align-items: center; gap: 0; }
        .search-box input {
            width: 240px; padding: 8px 12px 8px 36px; border: 1px solid #e8ecf1;
            border-radius: 8px 0 0 8px; font-size: 14px; outline: none; transition: all 0.2s;
            border-right: none;
        }
        .search-box input:focus { border-color: #40E0D0; box-shadow: none; border-right: none; }
        .search-box input::placeholder { color: #9ca3af; }
        .search-box .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #8892a0; font-size: 14px;
        }
        .search-box .search-btn {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 37px; background: #40E0D0; color: white;
            border: 1px solid #40E0D0; border-radius: 0 8px 8px 0;
            cursor: pointer; transition: background 0.2s;
        }
        .search-box .search-btn:hover { background: #2CC5B5; border-color: #2CC5B5; }

        .btn-create {
            padding: 8px 16px; background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .btn-create:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(64,224,208,0.3); }

        /* 面包屑 */
        .breadcrumb {
            display: flex; align-items: center; gap: 6px; padding: 10px 28px;
            font-size: 13px; color: #8892a0; background: #fff; border-bottom: 1px solid #e8ecf1;
        }
        .breadcrumb-item { cursor: pointer; color: #40E0D0; }
        .breadcrumb-item:hover { text-decoration: underline; }
        .breadcrumb-sep { color: #d1d5db; }
        .breadcrumb-current { color: #333; font-weight: 500; }
        .breadcrumb-home { cursor: pointer; color: #40E0D0; display: flex; align-items: center; gap: 4px; }

        /* 返回按钮 */
        .back-btn {
            display: flex; align-items: center; gap: 4px; padding: 6px 10px;
            background: #f5f6f7; border: none; border-radius: 8px; color: #666;
            font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .back-btn:hover { background: #e8ecf1; color: #333; }
        .back-btn svg { width: 16px; height: 16px; }

        /* 卡片区 */
        .content-area {
            flex: 1; padding: 24px 28px; overflow-y: auto;
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        .section-label {
            font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }

        .card-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        /* ===== 统一卡片样式 ===== */
        .item-card {
            background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e8ecf1;
            cursor: pointer; transition: all 0.2s; position: relative; z-index: 1;
            display: flex; flex-direction: column; gap: 10px;
        }
        .item-card:hover { border-color: #40E0D0; box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-2px); }
        .item-card.menu-open { z-index: 500; }

        .card-top { display: flex; align-items: flex-start; gap: 10px; }

        .card-icon {
            width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .card-icon.folder { background: #FEF3C7; }
        .card-icon.kb { background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%); }

        .card-title-area { flex: 1; min-width: 0; }
        .card-title-row { display: flex; align-items: center; gap: 8px; }
        .card-name {
            font-size: 15px; font-weight: 600; color: #1a1a2e;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .card-type-tag {
            padding: 2px 8px; background: #dbeafe; color: #2563eb;
            border-radius: 8px; font-size: 11px; font-weight: 500;
            flex-shrink: 0;
        }
        .card-type-tag.folder { background: #fef3c7; color: #d97706; }

        .card-desc {
            font-size: 13px; color: #64748b; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; min-height: 36px;
        }
        .card-desc.empty { color: #cbd5e1; }

        .card-bottom {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 8px; border-top: 1px solid #f1f5f9;
        }

        .card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .card-permission {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
            font-weight: 500;
        }
        .card-permission.private {
            background: #f1f5f9; color: #64748b;
        }
        .card-permission.collaborative {
            background: #ecfdf5; color: #059669;
        }

        .card-creator {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 11px; color: #64748b;
        }
        .card-creator .creator-avatar {
            width: 20px; height: 20px; border-radius: 50%;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 9px; font-weight: 600;
        }

        /* 协作者头像组 */
        .avatar-group { display: flex; align-items: center; }
        .avatar-group .avatar {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 10px; font-weight: 600;
            border: 2px solid #fff; margin-left: -6px;
        }
        .avatar-group .avatar:first-child { margin-left: 0; }
        .avatar-more {
            width: 24px; height: 24px; border-radius: 50%;
            background: #f1f5f9; color: #64748b; font-size: 9px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff; margin-left: -6px;
        }

        .visibility-tag {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 8px; border-radius: 8px; font-size: 11px;
        }
        .visibility-tag.private { background: #f1f5f9; color: #64748b; }
        .visibility-tag.team { background: #dbeafe; color: #2563eb; }
        .visibility-tag.department { background: #fef3c7; color: #d97706; }
        .visibility-tag.public { background: #dcfce7; color: #16a34a; }
        .visibility-tag.collab { background: #fed7aa; color: #ea580c; }

        .card-more-btn {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 6px; cursor: pointer; color: #9ca3af;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; position: relative;
        }
        .card-more-btn:hover { background: #f3f4f6; color: #374151; }

        /* 更多菜单 */
        .more-menu {
            position: absolute; top: 44px; right: 16px; background: #fff;
            border: 1px solid #e8ecf1; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 6px 0; min-width: 160px; z-index: 100; display: none;
        }
        .more-menu.show { display: block; }
        .more-menu-item {
            padding: 8px 14px; font-size: 13px; color: #333;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: background 0.15s;
        }
        .more-menu-item:hover { background: #f8fafc; }
        .more-menu-item.danger { color: #ef4444; }
        .more-menu-divider { height: 1px; background: #f1f5f9; margin: 4px 0; }

        /* 空状态 */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px; color: #999;
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; color: #ddd; }
        .empty-state h3 { font-size: 16px; font-weight: 500; color: #666; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: #999; margin-bottom: 20px; }

        /* 模态框 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 24px; width: 440px; max-width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { flex: 1; text-align: center; font-size: 18px; font-weight: 600; color: #333; }
        .modal-close {
            width: 32px; height: 32px; border: none; background: #f5f5f5; border-radius: 50%;
            cursor: pointer; font-size: 20px; color: #666; display: flex;
            justify-content: center; align-items: center;
        }
        .modal-body { margin-bottom: 20px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; font-weight: 500; }
        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 10px 12px; border: 1px solid #e8ecf1; border-radius: 8px;
            font-size: 14px; color: #333; outline: none; transition: all 0.2s;
            font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: #40E0D0; box-shadow: 0 0 0 3px rgba(64,224,208,0.15);
        }
        .form-textarea { resize: vertical; min-height: 80px; }

        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: #ffffff; color: #666; border: 1px solid #d9d9d9; }
        .btn-secondary:hover { background: #f5f5f5; }
        .btn-danger { color: white; background-color: #ef4444; }

        .type-toggle-btn {
            flex: 1; padding: 10px; border: 1px solid #e8ecf1; background: #fff;
            border-radius: 8px; font-size: 13px; color: #64748b; cursor: pointer;
            transition: all 0.2s; font-weight: 500;
        }
        .type-toggle-btn.active {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white; border-color: transparent;
        }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 20px;
            border-radius: 12px; color: white; font-size: 14px; z-index: 2000;
            animation: slideIn 0.3s; display: none;
        }
        .toast.show { display: block; }
        .toast.success { background: #2ed573; }
        .toast.error { background: #ff4757; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    </style>
    <script src="/front/js/auth.js?v=20260812"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                </svg>
            </div>
            <div class="sidebar-nav">
                <div class="sidebar-item" onclick="location.href='/front/'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="tooltip">对话</span>
                </div>
                <div class="sidebar-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span class="tooltip">知识库</span>
                </div>
                <div class="sidebar-item" onclick="location.href='/front/workbench.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="tooltip">工作台</span>
                </div>
                <div class="sidebar-item" onclick="location.href='/front/account.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

                    <span class="tooltip">账号</span>

            <div class="sidebar-bottom">
                <div class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip">帮助</span>
                </div>
                <div class="sidebar-avatar" onclick="location.href='/front/account.html'">U</div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="top-bar">
                <button class="back-btn" id="backBtn" style="display:none;" onclick="navigateBack()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    返回
                </button>
                <span class="top-bar-title" id="pageTitle">我的知识库</span>
                <div class="top-bar-actions">
                    <div class="search-box" style="position:relative;">
                        <input type="text" id="searchInput" placeholder="搜索名称" onkeydown="if(event.key==='Enter') performSearch()">
                        <span class="search-icon">🔍</span>
                        <button class="search-btn" onclick="performSearch()" title="搜索">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                    </div>
                    <button class="btn-create" onclick="showCreateMenu()">

    <!-- 新建模态框 -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="createModalTitle">新建</span>
                <button class="modal-close" onclick="hideCreateModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">类型</label>
                    <div style="display:flex;gap:8px;">
                        <button type="button" class="btn type-toggle-btn active" data-type="kb" onclick="switchCreateType('kb')">知识库</button>
                        <button type="button" class="btn type-toggle-btn" data-type="folder" onclick="switchCreateType('folder')">文件夹</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">名称</label>
                    <input type="text" class="form-input" id="newName" placeholder="请输入名称">
                </div>
                <div class="form-group" id="descGroup">
                    <label class="form-label">描述</label>
                    <textarea class="form-textarea" id="newDesc" placeholder="请输入描述（可选）"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideCreateModal()">取消</button>
                <button class="btn btn-primary" onclick="executeCreate()">确定</button>
            </div>
        </div>
    </div>

    <!-- 更多菜单的点击遮罩 -->
    <div id="menuOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:40;display:none;" onclick="hideAllMenus()"></div>

    <!-- 重命名模态框 -->
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">重命名</span>
                <button class="modal-close" onclick="hideRenameModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">名称</label>
                    <input type="text" class="form-input" id="renameName" placeholder="请输入新名称" onkeydown="if(event.key==='Enter') executeRename()">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideRenameModal()">取消</button>
                <button class="btn btn-primary" onclick="executeRename()">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    // ===== 状态 =====
    let currentFolderId = null;  // null = 根目录
    let currentFolderName = '我的知识库';
    let currentSearchVal = '';  // 当前搜索关键词
    let folderStack = [];  // 文件夹导航栈，每个元素是 {id, name}

    let allData = { folders: [], kbs: [] };
    let createType = null;  // 'folder' | 'kb'
    let cardData = [];  // 当前显示的卡片

    document.addEventListener('DOMContentLoaded', async function() {
        // 从 URL 恢复 folder_path 状态
        const urlParams = new URLSearchParams(window.location.search);
        const folderPathParam = urlParams.get('folder_path');
        const folderIdParam = urlParams.get('folder_id');
        
        if (folderPathParam) {
            try {
                const savedStack = JSON.parse(decodeURIComponent(folderPathParam));
                if (Array.isArray(savedStack) && savedStack.length > 0) {
                    folderStack = savedStack;
                    const lastFolder = savedStack[savedStack.length - 1];
                    currentFolderId = lastFolder.id;
                    currentFolderName = lastFolder.name || '文件夹';
                }
            } catch (e) {
                console.warn('解析 folder_path 失败:', e);
            }
        } else if (folderIdParam) {
            // 直接通过 folder_id 进入某个文件夹（无完整路径信息）
            currentFolderId = folderIdParam;
            // 填充 folderStack 最少一项，确保面包屑正常
            folderStack = [{ id: folderIdParam, name: '文件夹' }];
            // 尝试获取文件夹名称
            try {
                const folderRes = await Auth.fetch(`/api/knowledge/folder/${folderIdParam}`);
                if (folderRes.ok) {
                    const folderData = await folderRes.json();
                    if (folderData.name) {
                        currentFolderName = folderData.name;
                        folderStack = [{ id: folderIdParam, name: folderData.name }];
                    }
                }
            } catch (e) {
                console.warn('获取文件夹信息失败:', e);
            }
        }
        
        await loadData();
        setupGlobalClick();
    });

    function setupGlobalClick() {
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.card-more-btn') && !e.target.closest('.more-menu')) {
                hideAllMenus();
            }
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('show');
            }
        });
    }

    async function loadData() {
        try {
            // 加载文件夹（根目录或指定文件夹下的子文件夹）
            const folderUrl = currentFolderId
                ? `/api/knowledge/get_folders?parent_id=${currentFolderId}`
                : '/api/knowledge/get_folders';
            const [kbRes, folderRes] = await Promise.all([
                Auth.fetch(`/api/knowledge/get_kbs${currentFolderId ? '?folder_id=' + currentFolderId : ''}`),
                Auth.fetch(folderUrl)
            ]);

            if (!kbRes.ok || !folderRes.ok) throw new Error('加载失败');

            const kbData = await kbRes.json();
            const folderData = await folderRes.json();

            allData.kbs = kbData.kbs || [];
            allData.folders = folderData.folders || [];

            renderPage();
        } catch (error) {
            showToast('加载数据失败：' + error.message, 'error');
        }
    }

    function renderPage() {
        // 更新返回按钮和面包屑
        const backBtn = document.getElementById('backBtn');
        const breadcrumb = document.getElementById('breadcrumb');
        const breadcrumbRest = document.getElementById('breadcrumbRest');
        const pageTitle = document.getElementById('pageTitle');

        if (currentFolderId) {
            // 显示返回按钮
            backBtn.style.display = 'flex';
            
            // 更新页面标题为当前文件夹名
            pageTitle.textContent = currentFolderName;

            // 构建面包屑
            let breadcrumbHtml = '';
            folderStack.forEach((folder, index) => {
                if (index < folderStack.length - 1) {
                    // 中间层级可点击
                    breadcrumbHtml += `
                        <span class="breadcrumb-sep">/</span>
                        <span class="breadcrumb-item" onclick="navigateToFolder(${index})">${escapeHtml(folder.name)}</span>
                    `;
                } else {
                    // 当前层级不可点击
                    breadcrumbHtml += `
                        <span class="breadcrumb-sep">/</span>
                        <span class="breadcrumb-current">${escapeHtml(folder.name)}</span>
                    `;
                }
            });
            breadcrumbRest.innerHTML = breadcrumbHtml;
            breadcrumb.style.display = 'flex';
        } else {
            // 隐藏返回按钮
            backBtn.style.display = 'none';
            
            // 更新页面标题
            pageTitle.textContent = '我的知识库';
            
            // 隐藏面包屑
            breadcrumb.style.display = 'none';
        }

        const cards = [];

        // 文件夹
        allData.folders.forEach(f => {
            cards.push({
                type: 'folder',
                id: f.id,
                name: f.name,
                desc: f.desc || '',
                collaborator_count: f.collaborator_count || 1,
                owner_id: f.owner_id,
                owner_name: f.owner_name || '未知用户',
                is_owner: true,
            });
        });

        // 知识库
        allData.kbs.forEach(kb => {
            cards.push({
                type: 'kb',
                id: kb.id,
                name: kb.name,
                desc: kb.desc || '',
                collaborator_count: kb.collaborator_count || 1,
                owner_id: kb.owner_id,
                owner_name: kb.owner_name || '未知用户',
                is_owner: kb.is_owner,
                access_level: kb.access_level,
            });
        });

        cardData = cards;
        renderCards(cards);
    }

    function renderCards(cards) {
        const area = document.getElementById('contentArea');
        const filtered = currentSearchVal
            ? cards.filter(c => c.name.toLowerCase().includes(currentSearchVal))
            : cards;

        // 分离文件夹和知识库
        const folders = filtered.filter(c => c.type === 'folder');
        const kbs = filtered.filter(c => c.type === 'kb');

        if (filtered.length === 0) {
            area.innerHTML = `
                <div class="empty-state">
                    <div class="icon">${currentFolderId ? '📁' : '📂'}</div>
                    <h3>${currentFolderId ? '此文件夹为空' : '还没有内容'}</h3>
                    <p>${currentFolderId ? '点击右上角「新建」添加知识库' : '点击右上角「新建」创建文件夹或知识库'}</p>
                    <button class="btn-create" onclick="showCreateMenu()" style="margin:0 auto;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        新建
                    </button>
                </div>
            `;
            return;
        }

        let html = '';

        // 文件夹分组
        if (folders.length > 0) {
            html += '<div class="section-label">文件夹</div>';
            html += '<div class="card-grid">';
            html += folders.map(renderCard).join('');
            html += '</div>';
        }

        // 知识库分组
        if (kbs.length > 0) {
            if (folders.length > 0) {
                html += '<div style="height:24px;"></div>';
            }
            html += '<div class="section-label">知识库</div>';
            html += '<div class="card-grid">';
            html += kbs.map(renderCard).join('');
            html += '</div>';
        }

        area.innerHTML = html;
    }

    function renderCard(item) {
        const isFolder = item.type === 'folder';
        const iconSvg = isFolder
            ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`
            : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;

        const typeTag = isFolder
            ? `<span class="card-type-tag folder">文件夹</span>`
            : `<span class="card-type-tag">通用知识库</span>`;

        const descText = item.desc || (isFolder ? '点击进入查看内容' : '这个知识库还没有介绍~');
        const descEmpty = !item.desc ? ' empty' : '';

        const creatorHtml = renderCardMeta(item);

        return `
        <div class="item-card" onclick="openItem('${item.type}', '${item.id}', ${JSON.stringify(item.name).replace(/"/g, '&quot;')})">
            <div class="card-top">
                <div class="card-icon ${item.type}">${iconSvg}</div>
                <div class="card-title-area">
                    <div class="card-title-row">
                        <span class="card-name">${escapeHtml(item.name)}</span>
                        ${typeTag}
                    </div>
                </div>
            </div>
            <div class="card-desc${descEmpty}">${escapeHtml(descText)}</div>
            <div class="card-bottom">
                <div class="card-meta">
                    ${creatorHtml}
                </div>
                <button class="card-more-btn" onclick="event.stopPropagation(); toggleMoreMenu(this, '${item.type}', '${item.id}')" title="更多操作">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="19" cy="12" r="1"></circle>
                        <circle cx="5" cy="12" r="1"></circle>
                    </svg>
                </button>
            </div>
            <div class="more-menu" id="menu-${item.id}" data-type="${item.type}">
                ${isFolder ? `
                    <div class="more-menu-item" onclick="event.stopPropagation(); openItem('folder', '${item.id}', '${escapeHtml(item.name)}'); hideAllMenus();">
                         打开
                    </div>
                    <div class="more-menu-item" onclick="event.stopPropagation(); showRenameDialog('folder', '${item.id}', '${escapeHtml(item.name)}'); hideAllMenus();">
                         重命名
                    </div>
                    <div class="more-menu-item" onclick="event.stopPropagation(); showPermissionDialog('folder', '${item.id}'); hideAllMenus();">
                         权限
                    </div>
                    <div class="more-menu-divider"></div>
                    <div class="more-menu-item danger" onclick="event.stopPropagation(); confirmDelete('folder', '${item.id}', '${escapeHtml(item.name)}'); hideAllMenus();">
                         删除
                    </div>
                ` : `
                    <div class="more-menu-item" onclick="event.stopPropagation(); openItem('kb', '${item.id}'); hideAllMenus();">
                         打开
                    </div>
                    <div class="more-menu-item" onclick="event.stopPropagation(); showRenameDialog('kb', '${item.id}', '${escapeHtml(item.name)}'); hideAllMenus();">
                         重命名
                    </div>
                    <div class="more-menu-item" onclick="event.stopPropagation(); showMoveDialog('kb', '${item.id}'); hideAllMenus();">
                         移动
                    </div>
                    <div class="more-menu-item" onclick="event.stopPropagation(); showPermissionDialog('kb', '${item.id}'); hideAllMenus();">
                         权限
                    </div>
                    <div class="more-menu-divider"></div>
                    <div class="more-menu-item danger" onclick="event.stopPropagation(); confirmDelete('kb', '${item.id}', '${escapeHtml(item.name)}'); hideAllMenus();">
                         删除
                    </div>
                `}
            </div>
        </div>`;
    }

    function renderCardMeta(item) {
        const collabCount = item.collaborator_count || 1;
        const isPrivate = collabCount <= 1;
        const permLabel = isPrivate ? '私有' : '协作';
        const permClass = isPrivate ? 'private' : 'collaborative';

        const ownerName = item.owner_name || '未知用户';
        return `<span class="card-permission ${permClass}"> ${permLabel}</span><span class="card-creator"><span class="creator-avatar">${ownerName.charAt(0).toUpperCase()}</span>${escapeHtml(ownerName)}</span>`;
    }

    // ===== 操作 =====
    function openItem(type, id, name) {
        if (type === 'folder') {
            // 进入文件夹，推入栈
            folderStack.push({ id: id, name: name || '文件夹' });
            currentFolderId = id;
            currentFolderName = name || '文件夹';
            loadData();
        } else {
            // 进入知识库，传递文件夹路径
            const folderPath = encodeURIComponent(JSON.stringify(folderStack));
            location.href = `/front/kb_detail.html?kb_id=${id}&folder_path=${folderPath}`;
        }
    }

    function navigateBack() {
        if (folderStack.length > 0) {
            // 弹出栈顶
            folderStack.pop();
            if (folderStack.length > 0) {
                // 返回上一级文件夹
                const prevFolder = folderStack[folderStack.length - 1];
                currentFolderId = prevFolder.id;
                currentFolderName = prevFolder.name;
            } else {
                // 返回根目录
                currentFolderId = null;
                currentFolderName = '我的知识库';
            }
            loadData();
        }
    }

    function navigateToFolder(index) {
        // 跳转到指定层级的文件夹
        if (index >= 0 && index < folderStack.length) {
            // 截断栈到指定位置
            folderStack = folderStack.slice(0, index + 1);
            const targetFolder = folderStack[index];
            currentFolderId = targetFolder.id;
            currentFolderName = targetFolder.name;
            loadData();
        }
    }

    function navigateRoot() {
        // 清空栈
        folderStack = [];
        currentFolderId = null;
        currentFolderName = '我的知识库';
        loadData();
    }

    function toggleMoreMenu(btn, type, id) {
        const menu = document.getElementById('menu-' + id);
        const overlay = document.getElementById('menuOverlay');
        const card = btn.closest('.item-card');

        if (menu.classList.contains('show')) {
            hideAllMenus();
            return;
        }
        hideAllMenus();
        menu.classList.add('show');
        if (card) card.classList.add('menu-open');
        overlay.style.display = 'block';
    }

    function hideAllMenus() {
        document.querySelectorAll('.more-menu.show').forEach(m => m.classList.remove('show'));
        document.querySelectorAll('.item-card.menu-open').forEach(c => c.classList.remove('menu-open'));
        const overlay = document.getElementById('menuOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    function performSearch() {
        currentSearchVal = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        renderCards(cardData);
    }

    // ===== 新建 =====
    function switchCreateType(type) {
        createType = type;
        document.querySelectorAll('.type-toggle-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.type === type);
        });
        document.getElementById('createModalTitle').textContent = type === 'folder' ? '新建文件夹' : '新建知识库';
        document.getElementById('descGroup').style.display = type === 'folder' ? 'none' : 'block';
    }

    function showCreateMenu() {
        const modal = document.getElementById('createModal');
        switchCreateType('kb');
        document.getElementById('newName').value = '';
        document.getElementById('newDesc').value = '';
        
        // 在文件夹内时，隐藏"文件夹"选项
        const folderBtn = document.querySelector('.type-toggle-btn[data-type="folder"]');
        if (currentFolderId) {
            if (folderBtn) folderBtn.style.display = 'none';
        } else {
            if (folderBtn) folderBtn.style.display = '';
        }
        
        modal.classList.add('show');
    }

    function hideCreateModal() {
        document.getElementById('createModal').classList.remove('show');
    }

    async function executeCreate() {
        const name = document.getElementById('newName').value.trim();
        if (!name) {
            showToast('请输入名称', 'error');
            return;
        }

        try {
            if (createType === 'folder') {
                const parentId = currentFolderId || null;
                const res = await Auth.fetch('/api/knowledge/create_folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, parent_id: parentId })
                });
                if (!res.ok) throw new Error((await res.json()).message || '创建失败');
                showToast('文件夹创建成功', 'success');
            } else {
                const desc = document.getElementById('newDesc').value.trim();
                const folderId = currentFolderId || null;

                const res = await Auth.fetch('/api/knowledge/create_kb', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, desc, folder_id: folderId })
                });
                if (!res.ok) throw new Error((await res.json()).message || '创建失败');
                showToast('知识库创建成功', 'success');
            }
            hideCreateModal();
            loadData();
        } catch (error) {
            showToast('创建失败：' + error.message, 'error');
        }
    }

    // ===== 重命名 =====
    let renameType = null;
    let renameId = null;

    function showRenameDialog(type, id, currentName) {
        renameType = type;
        renameId = id;
        document.getElementById('renameName').value = currentName;
        document.getElementById('renameModal').classList.add('show');
        setTimeout(() => document.getElementById('renameName').focus(), 100);
    }

    function hideRenameModal() {
        document.getElementById('renameModal').classList.remove('show');
        renameType = null;
        renameId = null;
    }

    async function executeRename() {
        const newName = document.getElementById('renameName').value.trim();
        if (!newName) {
            showToast('请输入名称', 'error');
            return;
        }

        try {
            if (renameType === 'folder') {
                const res = await Auth.fetch(`/api/knowledge/folder/${renameId}/rename`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                if (!res.ok) throw new Error((await res.json()).message || '重命名失败');
                showToast('文件夹重命名成功', 'success');
            } else {
                const res = await Auth.fetch(`/api/knowledge/kb/${renameId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                if (!res.ok) throw new Error((await res.json()).message || '重命名失败');
                showToast('知识库重命名成功', 'success');
            }
            hideRenameModal();
            loadData();
        } catch (error) {
            showToast('重命名失败：' + error.message, 'error');
        }
    }

    // ===== 移动 =====
    function showMoveDialog(type, id) {
        showToast('移动功能开发中', 'success');
    }

    // ===== 权限 =====
    async function showPermissionDialog(type, id) {
        alert('权限设置功能开发中');
    }

    // ===== 删除 =====
    function confirmDelete(type, id, name) {
        if (!confirm(`确定要删除"${name}"吗？此操作不可恢复。`)) return;

        const url = type === 'folder'
            ? `/api/knowledge/folder/${id}`
            : `/api/knowledge/kb/${id}`;

        Auth.fetch(url, { method: 'DELETE' })
            .then(async res => {
                if (!res.ok) throw new Error((await res.json()).message || '删除失败');
                showToast('删除成功', 'success');
                loadData();
            })
            .catch(err => showToast('删除失败：' + err.message, 'error'));
    }

    // ===== 工具 =====
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    </script>
</body>
</html>
