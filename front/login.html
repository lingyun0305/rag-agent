<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AI对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1d29 0%, #2d3748 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            width: 420px;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
        }

        .login-logo svg {
            width: 32px;
            height: 32px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #8892a0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #e8ecf1;
            border-radius: 10px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-input:focus {
            border-color: #40E0D0;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.15);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(64, 224, 208, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #8892a0;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            z-index: 2000;
            animation: slideIn 0.3s;
            display: none;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            background: #2ed573;
        }

        .toast.error {
            background: #ff4757;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(64, 224, 208, 0.1) 0%, rgba(32, 178, 170, 0.05) 100%);
            top: -200px;
            right: -200px;
            pointer-events: none;
        }

        .bg-decoration-2 {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(64, 224, 208, 0.08) 0%, rgba(32, 178, 170, 0.03) 100%);
            bottom: -100px;
            left: -100px;
            pointer-events: none;
        }

        /* ===== 模态框 ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 400px;
            max-width: 90%;
            animation: modalIn 0.3s;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f5f5f5;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            color: #666;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }

        .btn-secondary {
            background: #ffffff;
            color: #666;
            border: 1px solid #d9d9d9;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="bg-decoration-2"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                </svg>
            </div>
            <div class="login-title">AI 对话助手</div>
            <div class="login-subtitle">登录以继续使用</div>
        </div>

        <div class="form-group">
            <label class="form-label">账号</label>
            <div class="form-input-wrapper">
                <input type="text" id="username" class="form-input" placeholder="请输入账号" autocomplete="username">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">密码</label>
            <div class="form-input-wrapper">
                <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
            </div>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">登录</button>

        <div class="login-footer">
            <p>还没有账号？<a href="javascript:void(0)" onclick="showRegisterForm()" style="color:#40E0D0;text-decoration:none;font-weight:500;">立即注册</a></p>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">注册账号</span>
                <button class="modal-close" onclick="hideRegisterModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">账号</label>
                    <div class="form-input-wrapper">
                        <input type="text" id="regUsername" class="form-input" placeholder="请输入账号">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <div class="form-input-wrapper">
                        <input type="password" id="regPassword" class="form-input" placeholder="请输入密码">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <div class="form-input-wrapper">
                        <input type="password" id="regPassword2" class="form-input" placeholder="请再次输入密码">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideRegisterModal()">取消</button>
                <button class="btn btn-primary" onclick="handleRegister()">注册</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 如果已经登录，直接跳转到首页
        const token = localStorage.getItem('access_token');
        if (token) {
            location.href = '/front/';
        }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!username) {
                showToast('请输入账号', 'error');
                return;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    let msg = data.message || data.msg || data.detail || '登录失败';
                    if (Array.isArray(msg)) {
                        msg = msg.map(e => e.msg || e.message || JSON.stringify(e)).join('；');
                    } else if (typeof msg === 'object') {
                        msg = JSON.stringify(msg);
                    }
                    throw new Error(msg);
                }

                // 保存 token
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('uid', data.uid);

                // 先验证 token 有效，再跳转
                try {
                    const verifyRes = await fetch('/api/auth/get_user_info', {
                        headers: { 'Authorization': `Bearer ${data.access_token}` }
                    });
                    if (verifyRes.ok) {
                        const userInfo = await verifyRes.json();
                        localStorage.setItem('user_info', JSON.stringify(userInfo));
                        showToast('登录成功', 'success');
                        setTimeout(() => {
                            location.href = '/front/';
                        }, 400);
                    } else if (verifyRes.status === 401) {
                        localStorage.removeItem('access_token');
                        throw new Error('Token验证失败，请重新登录');
                    } else {
                        // 验证接口异常，但token已保存，仍跳转（目标页auth.js会再次验证）
                        showToast('登录成功', 'success');
                        setTimeout(() => {
                            location.href = '/front/';
                        }, 400);
                    }
                } catch (verifyErr) {
                    if (verifyErr.message.includes('Token验证失败')) {
                        throw verifyErr;
                    }
                    showToast('登录成功', 'success');
                    setTimeout(() => {
                        location.href = '/front/';
                    }, 400);
                }
            } catch (error) {
                showToast(error.message, 'error');
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        // 回车登录
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== 注册功能 =====

        function showRegisterForm() {
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regPassword2').value = '';
            document.getElementById('registerModal').classList.add('show');
        }

        function hideRegisterModal() {
            document.getElementById('registerModal').classList.remove('show');
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const password2 = document.getElementById('regPassword2').value.trim();

            if (!username) {
                showToast('请输入账号', 'error');
                return;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                return;
            }
            if (password !== password2) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    let msg = data.message || data.msg || data.detail || '注册失败';
                    if (Array.isArray(msg)) {
                        msg = msg.map(e => e.msg || e.message || JSON.stringify(e)).join('；');
                    } else if (typeof msg === 'object') {
                        msg = JSON.stringify(msg);
                    }
                    throw new Error(msg);
                }

                // 注册成功，跳转到登录页
                hideRegisterModal();
                showToast('注册成功，请登录', 'success');
                document.getElementById('username').value = username;
                document.getElementById('password').focus();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // 注册弹窗回车提交
        document.getElementById('regPassword2').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleRegister();
            }
        });

        // 点击遮罩关闭弹窗
        document.getElementById('registerModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideRegisterModal();
            }
        });
    </script>
</body>
</html>
