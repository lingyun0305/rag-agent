<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参数设置 - AI对话助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f6f7;
            height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 64px; background: #1a1d29; display: flex; flex-direction: column;
            align-items: center; padding: 16px 0; flex-shrink: 0;
        }
        .sidebar-logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: white; margin-bottom: 24px;
        }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-item {
            width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; color: #8892a0; cursor: pointer; transition: all 0.2s; position: relative;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .sidebar-item.active { background: rgba(64, 224, 208, 0.2); color: #40E0D0; }
        .sidebar-item svg { width: 20px; height: 20px; }
        .sidebar-item .tooltip {
            position: absolute; left: 56px; background: #2d3748; color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 12px; white-space: nowrap;
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
        }
        .sidebar-item:hover .tooltip { opacity: 1; }
        .sidebar-bottom { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }
        .sidebar-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* ===== 主内容区 ===== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 顶部栏 */
        .top-bar {
            padding: 16px 24px; background: #ffffff; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #e8ecf1;
        }
        .back-btn {
            display: flex; align-items: center; gap: 6px; padding: 8px 14px;
            background: #f5f6f7; border: none; border-radius: 8px; color: #666;
            font-size: 14px; cursor: pointer; transition: all 0.2s;
        }
        .back-btn:hover { background: #e8ecf1; color: #333; }

        /* 内容区 */
        .content-area {
            flex: 1; padding: 24px; overflow-y: auto;
        }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

        /* 步骤条 */
        .steps-container {
            background: #fff; border-radius: 12px; padding: 24px 40px;
            border: 1px solid #e8ecf1; margin-bottom: 20px;
        }
        .steps {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 900px; margin: 0 auto;
        }
        .step {
            display: flex; align-items: center; gap: 10px;
        }
        .step-circle {
            width: 32px; height: 32px; border-radius: 50%;
            background: #e8ecf1; color: #9ca3af;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
            transition: all 0.3s;
        }
        .step.active .step-circle {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }
        .step.done .step-circle {
            background: #22c55e; color: white;
        }
        .step-text {
            font-size: 14px; color: #9ca3af; font-weight: 500;
        }
        .step.active .step-text { color: #1a1a2e; }
        .step.done .step-text { color: #22c55e; }
        .step-line {
            flex: 1; height: 2px; background: #e8ecf1; margin: 0 16px;
            min-width: 60px;
        }
        .step-line.done { background: #22c55e; }

        /* 配置区 */
        .config-section {
            background: #fff; border-radius: 12px; border: 1px solid #e8ecf1;
            margin-bottom: 16px; overflow: hidden;
        }
        .config-section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px; cursor: pointer; transition: background 0.2s;
        }
        .config-section-header:hover { background: #f8fafc; }
        .config-section-title {
            display: flex; align-items: center; gap: 8px;
            font-size: 15px; font-weight: 600; color: #1a1a2e;
            border-left: 3px solid #40E0D0; padding-left: 12px;
        }
        .config-section-toggle {
            width: 20px; height: 20px; color: #9ca3af;
            transition: transform 0.3s;
        }
        .config-section.collapsed .config-section-toggle { transform: rotate(180deg); }
        .config-section-body {
            padding: 20px 24px; border-top: 1px solid #f1f5f9;
            transition: max-height 0.3s ease;
        }
        .config-section.collapsed .config-section-body {
            display: none;
        }

        /* 单选卡片 */
        .radio-group { display: flex; flex-direction: column; gap: 12px; }
        .radio-card {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 16px 20px; border: 2px solid #e8ecf1; border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .radio-card:hover { border-color: #40E0D0; background: #f0fdfa; }
        .radio-card.selected { border-color: #40E0D0; background: #f0fdfa; }
        .radio-card-radio {
            width: 20px; height: 20px; border: 2px solid #cbd5e1;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 2px;
        }
        .radio-card.selected .radio-card-radio { border-color: #40E0D0; }
        .radio-card.selected .radio-card-radio::after {
            content: ''; width: 8px; height: 8px;
            background: #40E0D0; border-radius: 50%;
        }
        .radio-card-info { display: flex; flex-direction: column; }
        .radio-card-name {
            font-size: 15px; font-weight: 500; color: #1a1a2e;
            display: flex; align-items: center; gap: 6px;
        }
        .radio-card-desc { font-size: 13px; color: #64748b; margin-top: 2px; }
        .help-icon {
            width: 16px; height: 16px; border-radius: 50%;
            background: #e8ecf1; color: #64748b;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 600; cursor: help;
        }

        /* 配置表单 */
        .config-form { display: flex; flex-direction: column; gap: 20px; }
        .form-row {
            display: flex; align-items: center; gap: 16px;
        }
        .form-label {
            width: 120px; font-size: 14px; color: #475569; flex-shrink: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .help-icon-lg {
            width: 18px; height: 18px; border-radius: 50%;
            background: #e8ecf1; color: #64748b;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600; cursor: help;
        }
        .form-controls { display: flex; align-items: center; gap: 12px; }
        .form-select, .form-input {
            padding: 8px 12px; border: 1px solid #e8ecf1; border-radius: 8px;
            font-size: 14px; color: #333; outline: none; transition: all 0.2s;
            background: white;
        }
        .form-select:focus, .form-input:focus {
            border-color: #40E0D0; box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.15);
        }
        .form-select { min-width: 180px; }
        .form-input { width: 120px; }

        /* 复选框组 */
        .checkbox-group { display: flex; gap: 40px; flex-wrap: wrap; }
        .checkbox-item {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px; height: 18px; border: 1.5px solid #cbd5e1;
            border-radius: 4px; cursor: pointer; accent-color: #40E0D0;
        }
        .checkbox-item label {
            font-size: 14px; color: #475569; display: flex;
            align-items: center; gap: 6px; cursor: pointer;
        }

        /* 底部操作栏 */
        .footer-actions {
            display: flex; justify-content: flex-end; gap: 12px;
            padding-top: 8px; margin-top: 16px;
        }
        .btn {
            padding: 10px 24px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #fff; color: #64748b; border: 1px solid #e8ecf1; }
        .btn-secondary:hover { background: #f8fafc; }

        /* Toast */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 20px;
            border-radius: 12px; color: white; font-size: 14px; z-index: 2000;
            animation: slideIn 0.3s; display: none;
        }
        .toast.show { display: block; }
        .toast.success { background: #2ed573; }
        .toast.error { background: #ff4757; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    </style>
    <script src="/front/js/auth.js?v=20260801"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                </svg>
            </div>
            <div class="sidebar-nav">
                <div class="sidebar-item" onclick="location.href='/front/'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="tooltip">对话</span>
                </div>
                <div class="sidebar-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span class="tooltip">知识库</span>
                </div>
                <div class="sidebar-item" onclick="location.href='/front/workbench.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="tooltip">工作台</span>
                </div>
                <div class="sidebar-item" onclick="location.href='/front/account.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="tooltip">账号</span>
                </div>
            </div>
            <div class="sidebar-bottom">
                <div class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip">帮助</span>
                </div>
                <div class="sidebar-avatar" onclick="location.href='/front/account.html'">U</div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 顶部栏 -->
            <div class="top-bar">
                <button class="back-btn" onclick="goBack()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    上一步
                </button>
            </div>

            <!-- 内容区 -->
            <div class="content-area">
                <!-- 步骤条 -->
                <div class="steps-container">
                    <div class="steps">
                        <div class="step done" id="step1">
                            <div class="step-circle">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                            <div class="step-text">选择文件</div>
                        </div>
                        <div class="step-line done" id="line1"></div>
                        <div class="step active" id="step2">
                            <div class="step-circle">2</div>
                            <div class="step-text">参数设置</div>
                        </div>
                        <div class="step-line" id="line2"></div>
                        <div class="step" id="step3">
                            <div class="step-circle">3</div>
                            <div class="step-text">数据预览</div>
                        </div>
                        <div class="step-line" id="line3"></div>
                        <div class="step" id="step4">
                            <div class="step-circle">4</div>
                            <div class="step-text">确认上传</div>
                        </div>
                    </div>
                </div>

                <!-- 分块处理参数 -->
                <div class="config-section" id="section_chunk_params">
                    <div class="config-section-header" onclick="toggleSection('section_chunk_params')">
                        <div class="config-section-title">分块处理参数</div>
                        <svg class="config-section-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="config-section-body">
                        <div class="radio-group" style="margin-bottom: 20px;">
                            <div class="radio-card selected" data-value="default" onclick="selectChunkParam('default')">
                                <div class="radio-card-radio"></div>
                                <div class="radio-card-info">
                                    <div class="radio-card-name">默认</div>
                                    <div class="radio-card-desc">使用系统默认的参数和规则（分块大小500，重叠50）</div>
                                </div>
                            </div>
                            <div class="radio-card" data-value="custom" onclick="selectChunkParam('custom')">
                                <div class="radio-card-radio"></div>
                                <div class="radio-card-info">
                                    <div class="radio-card-name">自定义</div>
                                    <div class="radio-card-desc">自定义设置分块大小和重叠参数</div>
                                </div>
                            </div>
                        </div>

                        <div id="customParams" style="display:none;">
                            <div class="config-form">
                                <div class="form-row">
                                    <div class="form-label">分块大小 <span class="help-icon-lg">?</span></div>
                                    <div class="form-controls">
                                        <input type="number" class="form-input" id="chunkSize" value="500" min="50" max="10000" style="width:120px;">
                                        <span style="font-size:13px;color:#64748b;">字符数</span>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-label">重叠大小 <span class="help-icon-lg">?</span></div>
                                    <div class="form-controls">
                                        <input type="number" class="form-input" id="chunkOverlap" value="50" min="0" max="500" style="width:120px;">
                                        <span style="font-size:13px;color:#64748b;">字符数</span>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-label">Top K <span class="help-icon-lg">?</span></div>
                                    <div class="form-controls">
                                        <input type="number" class="form-input" id="topK" value="6" min="1" max="100" style="width:120px;">
                                        <span style="font-size:13px;color:#64748b;">条</span>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-label">相似度阈值 <span class="help-icon-lg">?</span></div>
                                    <div class="form-controls">
                                        <input type="number" class="form-input" id="scoreThreshold" value="0.0" min="0" max="1" step="0.05" style="width:120px;">
                                        <span style="font-size:13px;color:#64748b;">(0-1)</span>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-label">嵌入模型 <span class="help-icon-lg">?</span></div>
                                    <div class="form-controls">
                                        <select class="form-select" id="embeddingModel" style="min-width:180px;">
                                            <option value="">加载中...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 底部操作 -->
                <div class="footer-actions">
                    <button class="btn btn-primary" onclick="goToNextStep()">
                        下一步
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const kbId = urlParams.get('kb_id') || '';
    const sourceType = urlParams.get('source') || 'file';  // 'file' or 'text'

    // 根据来源类型更新步骤条文字
    if (sourceType === 'text') {
        const step1Text = document.querySelector('#step1 .step-text');
        if (step1Text) step1Text.textContent = '输入内容';
    }

    let config = {
        chunk_size: 500,
        chunk_overlap: 50,
        separators: ["\n\n", "\n", "。", "，", " "],
        top_k: 6,
        score_threshold: 0.0,
        embedding_model: "bge"
    };

    // 读取上传文件信息（含 batch_id）
    let uploadedFiles = [];
    try {
        uploadedFiles = JSON.parse(sessionStorage.getItem('uploaded_files') || '[]');
    } catch (e) {
        uploadedFiles = [];
    }

    function goBack() {
        location.href = `/front/upload.html?kb_id=${kbId}&source=${sourceType}&v=20260802`;
    }

    function toggleSection(sectionId) {
        const section = document.getElementById(sectionId);
        section.classList.toggle('collapsed');
    }

    function selectChunkParam(mode) {
        config.chunkParamMode = mode;
        document.querySelectorAll('#section_chunk_params .radio-card').forEach(card => {
            card.classList.toggle('selected', card.dataset.value === mode);
        });
        const customParams = document.getElementById('customParams');
        if (mode === 'custom') {
            customParams.style.display = 'block';
            config.chunk_size = parseInt(document.getElementById('chunkSize').value) || 500;
            config.chunk_overlap = parseInt(document.getElementById('chunkOverlap').value) || 50;
            config.top_k = parseInt(document.getElementById('topK').value) || 6;
            config.score_threshold = parseFloat(document.getElementById('scoreThreshold').value) || 0.0;
            config.embedding_model = document.getElementById('embeddingModel').value || 'bge';
        } else {
            customParams.style.display = 'none';
            config.chunk_size = 500;
            config.chunk_overlap = 50;
            config.separators = ["\n\n", "\n", "。", "，", " "];
            config.top_k = 6;
            config.score_threshold = 0.0;
            config.embedding_model = "bge";
        }
    }

    function saveCustomParams() {
        config.chunk_size = parseInt(document.getElementById('chunkSize').value) || 500;
        config.chunk_overlap = parseInt(document.getElementById('chunkOverlap').value) || 50;
        config.top_k = parseInt(document.getElementById('topK').value) || 6;
        config.score_threshold = parseFloat(document.getElementById('scoreThreshold').value) || 0.0;
        config.embedding_model = document.getElementById('embeddingModel').value || 'bge';
    }

    async function goToNextStep() {
        saveCustomParams();

        const validFiles = uploadedFiles.filter(f => f.batch_id);
        if (validFiles.length === 0) {
            showToast('没有找到已暂存的文件，请返回重新上传', 'error');
            return;
        }

        const token = localStorage.getItem('access_token');
        const allPreviews = [];
        let failedCount = 0;

        showToast(`正在为 ${validFiles.length} 个文件生成预览...`, 'success');

        for (const file of validFiles) {
            try {
                const resp = await fetch('/api/knowledge/upload/preview', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        batch_id: file.batch_id,
                        chunk_size: config.chunk_size,
                        chunk_overlap: config.chunk_overlap,
                        separators: config.separators,
                        top_k: config.top_k,
                        score_threshold: config.score_threshold,
                        embedding_model: config.embedding_model
                    })
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    file._error = err.msg || '预览生成失败';
                    failedCount++;
                    continue;
                }

                const data = await resp.json();
                if (!data.success) {
                    file._error = data.msg || '预览生成失败';
                    failedCount++;
                    continue;
                }

                allPreviews.push({
                    ...data,
                    _batch_id: file.batch_id,
                    _orig_name: file.name
                });
            } catch (err) {
                file._error = err.message || '预览生成失败';
                failedCount++;
            }
        }

        if (allPreviews.length === 0) {
            showToast(`所有文件预览生成失败`, 'error');
            return;
        }

        // 保存成功的预览结果和对应的文件信息
        const previewJson = JSON.stringify(allPreviews);
        console.log('[upload_params] 保存预览数据:', {
            count: allPreviews.length,
            dataSize: previewJson.length,
            firstFile: allPreviews[0] ? {
                file_name: allPreviews[0].file_name,
                total_chunks: allPreviews[0].total_chunks,
                preview_chunks_count: allPreviews[0].preview_chunks ? allPreviews[0].preview_chunks.length : 0
            } : null
        });
        
        try {
            sessionStorage.setItem('preview_results', previewJson);
            console.log('[upload_params] preview_results 保存成功，大小:', previewJson.length);
        } catch (e) {
            console.error('[upload_params] preview_results 保存失败:', e);
            showToast('预览数据存储失败，请检查文件大小', 'error');
            return;
        }
        
        sessionStorage.setItem('upload_config', JSON.stringify(config));

        // 将失败的文件从 uploaded_files 中移除
        const successBatchIds = new Set(allPreviews.map(p => p._batch_id));
        const remainingFiles = uploadedFiles.filter(f => successBatchIds.has(f.batch_id));
        sessionStorage.setItem('uploaded_files', JSON.stringify(remainingFiles));
        console.log('[upload_params] uploaded_files 更新后:', remainingFiles.length, '个文件');

        const successMsg = failedCount > 0
            ? `${allPreviews.length} 个预览成功，${failedCount} 个失败`
            : `${allPreviews.length} 个文件预览生成成功`;
        showToast(successMsg, failedCount > 0 ? 'error' : 'success');

        setTimeout(() => {
            location.href = `/front/upload_preview.html?kb_id=${kbId}&v=20260802`;
        }, 500);
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // 动态加载可用嵌入模型列表
    async function loadEmbeddingModels() {
        const selectEl = document.getElementById('embeddingModel');
        try {
            const token = localStorage.getItem('access_token');
            const resp = await fetch('/api/knowledge/embedding_models', {
                method: 'GET',
                headers: {
                    'Authorization': token ? `Bearer ${token}` : ''
                }
            });
            if (!resp.ok) throw new Error('加载嵌入模型列表失败');
            const data = await resp.json();
            if (!data.success || !Array.isArray(data.models) || data.models.length === 0) {
                throw new Error('没有可用的嵌入模型');
            }
            // 渲染下拉选项：value 用 provider（bge / openai），显示用 display_name
            selectEl.innerHTML = '';
            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.provider;
                opt.textContent = m.display_name;
                selectEl.appendChild(opt);
            });
            // 默认选中 backend 返回的 default provider
            if (data.default) {
                selectEl.value = data.default;
            }
            // 同步到 config
            config.embedding_model = selectEl.value;
        } catch (err) {
            selectEl.innerHTML = '<option value="">加载失败</option>';
            showToast(err.message || '嵌入模型列表加载失败', 'error');
            // 兜底：至少有 bge
            config.embedding_model = 'bge';
        }
    }

    // 初始化
    loadEmbeddingModels();
    </script>
</body>
