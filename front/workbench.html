<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>工作台 - AI对话助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 64px;
            background: #1a1d29;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            flex-shrink: 0;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 24px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .sidebar-item {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8892a0;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .sidebar-item.active {
            background: rgba(64, 224, 208, 0.2);
            color: #40E0D0;
        }

        .sidebar-item svg {
            width: 20px;
            height: 20px;
        }

        .sidebar-item .tooltip {
            position: absolute;
            left: 56px;
            background: #2d3748;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .sidebar-item:hover .tooltip {
            opacity: 1;
        }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .sidebar-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ===== 工作台子导航 ===== */
        .workbench-nav {
            width: 220px;
            background: #ffffff;
            border-right: 1px solid #e8ecf1;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .workbench-nav-header {
            padding: 20px;
            border-bottom: 1px solid #e8ecf1;
        }

        .workbench-nav-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .workbench-nav-list {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .workbench-nav-item {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #4b5563;
            transition: all 0.2s;
        }

        .workbench-nav-item:hover {
            background: #f5f6f7;
        }

        .workbench-nav-item.active {
            background: rgba(64, 224, 208, 0.1);
            color: #40E0D0;
        }

        .workbench-nav-item svg {
            width: 18px;
            height: 18px;
        }

        /* ===== 主内容区域 ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f8f9fa;
        }

        .page-header {
            padding: 20px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e8ecf1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-input-wrapper {
            position: relative;
            width: 260px;
        }

        .search-input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: 1px solid #e8ecf1;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #40E0D0;
            box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.1);
        }

        .search-input::placeholder {
            color: #9ca3af;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8892a0;
            font-size: 14px;
        }

        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(64, 224, 208, 0.3);
        }

        .btn-secondary {
            background: #ffffff;
            color: #4b5563;
            border: 1px solid #e8ecf1;
        }

        .btn-secondary:hover {
            background: #f5f6f7;
            border-color: #d1d5db;
        }

        /* ===== Tab 页面 ===== */
        .tab-page {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .tab-page.active {
            display: flex;
        }

        /* ===== 页面内容 ===== */
        .page-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .page-content::-webkit-scrollbar {
            width: 6px;
        }

        .page-content::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 80px 20px;
            color: #999;
            z-index: 10;
            position: relative;
            pointer-events: auto;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 500;
            color: #666;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #999;
            margin-bottom: 24px;
        }

        /* ===== 工具卡片网格 ===== */
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
        }

        .tool-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e8ecf1;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .tool-card:hover {
            border-color: #40E0D0;
            box-shadow: 0 2px 12px rgba(64, 224, 208, 0.15);
        }

        /* 卡片头部：图标 + 名称 + 标签 */
        .tool-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tool-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #40E0D0 0%, #20B2AA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            color: white;
        }

        .tool-card-title-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .tool-card-name {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a2e;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tool-card-tag {
            padding: 4px 10px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* 卡片描述 */
        .tool-card-desc {
            font-size: 14px;
            color: #8892a0;
            line-height: 1.5;
            min-height: 42px;
        }

        /* 卡片底部：元信息 */
        .tool-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .tool-card-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #9ca3af;
        }

        .tool-card-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 22px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            z-index: 2000;
            animation: slideIn 0.3s;
            display: none;
        }

        .toast.show {
            display: block;
        }

        .toast.success {
            background: #2ed573;
        }

        .toast.error {
            background: #ff4757;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>

    <script>
        // 数据状态
        let myTools = [];
        let systemTools = [];

        // API 请求
        async function apiRequest(url, options = {}) {
            const token = localStorage.getItem('access_token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...(options.headers || {})
            };
            const response = await fetch(url, {
                ...options,
                headers,
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_info');
                showToast('登录已过期，正在跳转到登录页...', 'error');
                setTimeout(() => {
                    window.location.href = '/front/login.html';
                }, 1500);
                throw new Error('登录已过期，请重新登录');
            }
            if (!response.ok) {
                let msg = '请求失败';
                try {
                    const error = await response.json();
                    msg = error.message || error.msg || msg;
                } catch (e) {
                    msg = `服务器错误 (${response.status})`;
                }
                throw new Error(msg);
            }
            return response.json();
        }

        async function loadMyTools() {
            try {
                const data = await apiRequest('/api/agent/tools/my');
                myTools = data.tools || [];
                renderMyTools(myTools);
            } catch (error) {
                showToast(error.message, 'error');
                renderMyTools([]);
            }
        }

        async function loadSystemTools() {
            try {
                const data = await apiRequest('/api/agent/tools/system');
                systemTools = data.tools || [];
                renderSystemTools(systemTools);
            } catch (error) {
                showToast(error.message, 'error');
                renderSystemTools([]);
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.workbench-nav-item').forEach(item => item.classList.remove('active'));
            if (el) el.classList.add('active');
            document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
            const pageEl = document.getElementById(tab + '-page');
            if (pageEl) pageEl.classList.add('active');
        }

        function renderMyTools(tools) {
            const list = document.getElementById('my-tools-list');
            const empty = document.getElementById('my-tools-empty');
            if (tools.length === 0) {
                list.style.display = 'none';
                empty.style.display = 'flex';
                return;
            }
            empty.style.display = 'none';
            list.style.display = 'grid';
            list.innerHTML = tools.map(tool => {
                const isPublic = (tool.visibility || 'public') === 'public';
                const visBadge = `<span style="font-size:11px; padding:1px 7px; border-radius:4px; ${isPublic ? 'background:#e6f7f4; color:#0d9488;' : 'background:#f1f5f9; color:#64748b;'}">${isPublic ? '公开' : '私有'}</span>`;
                return `
                <div class="tool-card">
                    <div class="tool-card-header">
                        <div class="tool-card-icon">${escapeHtml(tool.icon || '🧩')}</div>
                        <div class="tool-card-title-wrap">
                            <div class="tool-card-name">${escapeHtml(tool.name)}</div>
                            <div class="tool-card-tag">自定义</div>
                        </div>
                        ${visBadge}
                    </div>
                    <div class="tool-card-desc">${escapeHtml(tool.desc || '暂无描述')}</div>
                    <div class="tool-card-footer">
                        <div class="tool-card-meta">
                            <div class="tool-card-meta-item">
                                <span>👤</span>
                                <span>${isPublic ? '全员可见' : '仅自己可见'}</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderSystemTools(tools) {
            const grid = document.getElementById('system-tools-grid');
            const empty = document.getElementById('system-tools-empty');
            if (tools.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'flex';
                return;
            }
            empty.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = tools.map(tool => `
                <div class="tool-card">
                    <div class="tool-card-header">
                        <div class="tool-card-icon">⚙️</div>
                        <div class="tool-card-title-wrap">
                            <div class="tool-card-name">${escapeHtml(tool.name)}</div>
                            <div class="tool-card-tag">系统</div>
                        </div>
                    </div>
                    <div class="tool-card-desc">${escapeHtml(tool.desc || '暂无描述')}</div>
                    <div class="tool-card-footer">
                        <div class="tool-card-meta">
                            <div class="tool-card-meta-item">
                                <span>⚙️</span>
                                <span>系统工具</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterMyTools() {
            const keyword = document.getElementById('myToolsSearch').value.trim().toLowerCase();
            const filtered = myTools.filter(tool =>
                tool.name.toLowerCase().includes(keyword) ||
                (tool.desc || '').toLowerCase().includes(keyword)
            );
            renderMyTools(filtered);
        }

        function filterSystemTools() {
            const keyword = document.getElementById('systemToolsSearch').value.trim().toLowerCase();
            const filtered = systemTools.filter(tool =>
                tool.name.toLowerCase().includes(keyword) ||
                (tool.desc || '').toLowerCase().includes(keyword)
            );
            renderSystemTools(filtered);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ====== 创建工具弹窗 ======
        function openCreateToolModal() {
            document.getElementById('createToolModal').style.display = 'flex';
        }
        function closeCreateToolModal() {
            document.getElementById('createToolModal').style.display = 'none';
        }
        async function submitCreateTool() {
            const name = document.getElementById('ct-name').value.trim();
            if (!name) {
                showToast('请填写工具名称', 'error');
                return;
            }
            const body = {
                name,
                desc: document.getElementById('ct-desc').value.trim(),
                icon: document.getElementById('ct-icon').value.trim() || '🧩',
                code_path: document.getElementById('ct-codepath').value.trim(),
                parameters_schema: document.getElementById('ct-params').value.trim() || '{}',
                visibility: document.getElementById('ct-visibility').value || 'public',
            };
            try {
                await apiRequest('/api/agent/tools', { method: 'POST', body });
                showToast('工具创建成功', 'success');
                closeCreateToolModal();
                // 清空表单
                document.getElementById('ct-name').value = '';
                document.getElementById('ct-desc').value = '';
                document.getElementById('ct-codepath').value = '';
                document.getElementById('ct-params').value = '{}';
                await loadMyTools();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function applyRoleVisibility() {
            // 仅 admin / super_admin 可见"创建工具"入口
            const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');
            const isAdmin = userInfo.role === 'admin' || userInfo.role === 'super_admin';
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.display = isAdmin ? '' : 'none';
            });
        }

        // 初始化加载 - 等待 auth.js 验证 token 完成后再加载数据
        document.addEventListener('DOMContentLoaded', async () => {
            // 等待 Auth.init() 完成（验证 token 有效性）
            if (window.Auth) {
                try {
                    await window.Auth.init();
                } catch (e) {
                    // init 失败（如 token 无效），auth.js 会自动跳转
                    return;
                }
            }
            // 根据角色控制"创建工具"入口可见性
            applyRoleVisibility();
            // 只有验证通过后才加载工具数据
            await Promise.all([loadMyTools(), loadSystemTools()]);
        });
    </script>
</body>
</html>
